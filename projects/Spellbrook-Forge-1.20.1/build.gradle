plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-forge-${minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'info'; mods { spellbrook { source sourceSets.main } } }
        server { workingDirectory project.file('run-server'); property 'forge.logging.console.level', 'info'; mods { spellbrook { source sourceSets.main } } }
    }
}

repositories { mavenCentral() }

def hexereiDevJar = file('libs/Hexerei-0.4.2.3-Performance-Overhaul-v4-Forge-1.20.1.jar')

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    if (hexereiDevJar.exists()) {
        compileOnly files(hexereiDevJar)
    }
}

// The compatibility source is deliberately optional. A standalone build is valid without Hexerei;
// the release build that includes the Hexerei bridge must place the exact target JAR in libs/.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (!hexereiDevJar.exists()) {
        exclude 'com/herbertofury/spellbrook/compat/hexerei/**'
    }
}

processResources {
    def replaceProperties = [minecraft_version:minecraft_version, forge_version:forge_version, mod_id:mod_id, mod_name:mod_name, mod_version:mod_version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties + [project: project] }
}

jar { manifest { attributes(['Specification-Title': mod_name, 'Specification-Vendor': 'Bert / INTA', 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion, 'Implementation-Vendor': 'Bert / INTA']) } }
jar.finalizedBy('reobfJar')
