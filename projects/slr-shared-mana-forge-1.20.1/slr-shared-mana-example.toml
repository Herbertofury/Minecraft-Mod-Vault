[shared_mana]
# Master bridge switch. Default ON for backwards compatibility.
enabled = true

# Opt-in alternate mode. Default OFF.
# false = classic shared SLR-authoritative pool (v1.0 behavior)
# true  = native separate pools; SLR borrows only an actual spending shortage from Iron
separatePoolsBorrowFromIron = false

# 1 Iron mana equals this many SLR MP.
slrMpPerIronMana = 10.0

# Classic shared mode only. Separate-pools mode keeps native Iron regeneration.
suppressIronPassiveRegen = true

# Classic shared mode only. Separate-pools mode keeps positive gains in their native pools.
acceptPositiveIronManaCredits = true

# Classic shared mode only.
slrManaRefreshTicks = 40

[irons_botany]
logDetectedModeOnServerStart = true

[client]
# Classic shared mode only. Separate-pools mode always retains Iron's native mana HUD.
hideIronsManaHud = true
