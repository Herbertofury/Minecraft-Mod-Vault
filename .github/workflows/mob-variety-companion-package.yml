name: Mob Variety Companion Package
on:
  push:
    branches: [ main ]
    paths:
      - 'research/mob-variety/explorer/companion/runtime-template.tar.gz.b64.part-*'
      - 'research/mob-variety/explorer/companion/README.md'
      - '.github/workflows/mob-variety-companion-package.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runtime source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force work/app | Out-Null
          $parts = Get-ChildItem research/mob-variety/explorer/companion/runtime-template.tar.gz.b64.part-* | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 23268) { throw "Unexpected base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'work/runtime-template.tar.gz'), [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash work/runtime-template.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '1b59aaced1272a1580df0de16a01f90bfe22e80033ea2f4a5fee57c688a39f0e') { throw "Runtime template hash mismatch: $hash" }
          tar -xzf work/runtime-template.tar.gz -C work/app
          node --check work/app/main.js
          node --check work/app/preload.js
          node --check work/app/catalog-preload.js
          node --check work/app/shell.js
      - name: Fetch and verify official Electron 44 Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force work/downloads | Out-Null
          curl.exe -fL --retry 4 -o work/downloads/electron-win.zip https://github.com/electron/electron/releases/download/v44.0.0/electron-v44.0.0-win32-x64.zip
          $hash = (Get-FileHash work/downloads/electron-win.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'e61aa3bcea8152bc0730abd015e47c032d778a0ef10e2a1c78ba3c4ea47942f9') { throw "Electron Windows hash mismatch: $hash" }
      - name: Real Electron browser-shell self test on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force work/runtime | Out-Null
          Expand-Archive -Path work/downloads/electron-win.zip -DestinationPath work/runtime -Force
          Remove-Item work/runtime/resources/default_app.asar -Force -ErrorAction SilentlyContinue
          Remove-Item work/runtime/resources/app -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item work/app work/runtime/resources/app -Recurse -Force
          $env:MV_SELF_TEST_OUT = (Join-Path $PWD 'work/self-test.json')
          $appPath = (Join-Path $PWD 'work/runtime/resources/app')
          $proc = Start-Process -FilePath (Join-Path $PWD 'work/runtime/electron.exe') -ArgumentList @($appPath, '--self-test', '--disable-gpu') -PassThru
          $deadline = (Get-Date).AddSeconds(65)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500; $proc.Refresh() }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw 'Electron self-test timed out.' }
          if (-not (Test-Path work/self-test.json)) { throw "Electron exited $($proc.ExitCode) without self-test report." }
          $report = Get-Content work/self-test.json -Raw | ConvertFrom-Json
          $report | ConvertTo-Json -Depth 10
          if (-not $report.passed) { throw 'Electron browser-shell self-test reported failure.' }
          foreach ($test in $report.tests) { if (-not $test.ok) { throw "Failed shell test: $($test.name)" } }
          Write-Host "Electron shell self-test: $($report.tests.Count) checks passed"
      - name: Build Windows x64 portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'work/windows/Minecraft Mob Variety - Companion'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item work/runtime/* $dest -Recurse -Force
          New-Item -ItemType Directory -Force "$dest/resources/app/docs" | Out-Null
          Copy-Item work/self-test.json "$dest/resources/app/docs/runtime-self-test-ci.json" -Force
          Rename-Item "$dest/electron.exe" 'Minecraft Mob Variety - Companion.exe'
          @"
          Electron v44.0.0
          Chromium 152
          Browser-shell QA executed on Windows using the exact packaged Electron runtime.
          Shell QA: resources/app/docs/runtime-self-test-ci.json
          Source commit: $env:GITHUB_SHA
          "@ | Set-Content "$dest/BUILD-PROVENANCE.txt" -Encoding utf8
          $zip = Join-Path $PWD 'Minecraft Mob Variety - Companion.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $dest -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: mob-variety-companion-win-x64
          path: Minecraft Mob Variety - Companion.zip
          compression-level: 0
          retention-days: 7
