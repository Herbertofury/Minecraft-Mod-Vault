name: Build Vanilla Feature Atlas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate atlas builder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile devkit-orchestrator/tools/build_vanilla_atlas.py
      - name: Build complete latest-to-oldest atlas
        shell: bash
        run: |
          set -euo pipefail
          python3 devkit-orchestrator/tools/build_vanilla_atlas.py \
            --out out/vanilla-atlas \
            --work .atlas-work \
            --workers 32 \
            --with-provider-inventory
      - name: Strict completeness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('out/vanilla-atlas/VANILLA-ATLAS.json').read_text())
          c=a['coverage']
          assert a['schema']==2
          assert c['officialVersions']>900
          assert c['soundEvents']>2000
          assert c['soundDefinitions']>1900
          assert c['registryEntries']>39000
          assert c['externalAssetPaths']>7000
          assert c['resourcePaths']>1000
          assert c['dataPaths']>1000
          assert c['assetIndexes']>50
          print(json.dumps(json.loads(Path('out/vanilla-atlas/BUILD-RECEIPT.json').read_text()),indent=2))
          PY
      - name: Package atlas
        shell: bash
        run: |
          set -euo pipefail
          NAME="Minecraft-Vanilla-Feature-Atlas-COMPLETE-$(date -u +%Y-%m-%d).tar.zst"
          tar --sort=name --mtime='UTC 2026-08-28' --owner=0 --group=0 --numeric-owner \
            -C out -cf - vanilla-atlas | zstd -T0 -6 -o "out/$NAME"
          sha256sum "out/$NAME" > out/ATLAS-PACKAGE-SHA256.txt
          du -sh out/vanilla-atlas "out/$NAME"
      - name: Upload atlas artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-vanilla-feature-atlas-complete
          path: |
            out/Minecraft-Vanilla-Feature-Atlas-COMPLETE-*.tar.zst
            out/ATLAS-PACKAGE-SHA256.txt
            out/vanilla-atlas/BUILD-RECEIPT.json
            out/vanilla-atlas/SOURCES.md
            out/vanilla-atlas/SHA256SUMS.txt
            out/vanilla-atlas/VANILLA-ATLAS.json
          compression-level: 0
          retention-days: 7
