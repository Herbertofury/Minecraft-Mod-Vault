name: Build Vanilla Feature Atlas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vanilla-feature-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare builder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile devkit-orchestrator/tools/build_vanilla_atlas.py
          # The initial builder intentionally used no-checkout clones for git-show history.
          # minecraft-data also needs its working tree for pre-1.14 normalized files.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('devkit-orchestrator/tools/build_vanilla_atlas.py')
          s=p.read_text()
          needle='clone_repo("https://github.com/PrismarineJS/minecraft-data.git", minecraft_data, depth=1)\n'
          repl=needle+'    run(["git", "checkout", "--detach", "HEAD"], cwd=minecraft_data, capture=False)\n'
          if repl not in s:
              if needle not in s: raise SystemExit('builder patch anchor missing')
              s=s.replace(needle,repl)
          p.write_text(s)
          PY
      - name: Build authoritative + derived atlas
        shell: bash
        run: |
          set -euo pipefail
          python3 devkit-orchestrator/tools/build_vanilla_atlas.py \
            --out out/vanilla-atlas \
            --work .atlas-work \
            --workers 24 \
            --with-provider-inventory
      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('out/vanilla-atlas/VANILLA-ATLAS.json').read_text())
          r=json.loads(Path('out/vanilla-atlas/BUILD-RECEIPT.json').read_text())
          assert a['schema']==2
          assert a['latestRelease']
          assert a['latestSnapshot']
          assert a['coverage']['officialVersions'] > 100
          assert a['coverage']['soundEvents'] > 500
          assert a['coverage']['externalAssetPaths'] > 1000
          assert len(a.get('assetIndexes',{})) > 10
          print(json.dumps(r,indent=2))
          PY
      - name: Package atlas
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 2026-08-28' --owner=0 --group=0 --numeric-owner \
            -C out -cf - vanilla-atlas | zstd -T0 -6 -o out/Minecraft-Vanilla-Feature-Atlas-2026-08-28.tar.zst
          sha256sum out/Minecraft-Vanilla-Feature-Atlas-2026-08-28.tar.zst > out/ATLAS-PACKAGE-SHA256.txt
          du -sh out/vanilla-atlas out/Minecraft-Vanilla-Feature-Atlas-2026-08-28.tar.zst
          cat out/ATLAS-PACKAGE-SHA256.txt
      - name: Upload atlas artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-vanilla-feature-atlas-2026-08-28
          path: |
            out/Minecraft-Vanilla-Feature-Atlas-2026-08-28.tar.zst
            out/ATLAS-PACKAGE-SHA256.txt
            out/vanilla-atlas/BUILD-RECEIPT.json
            out/vanilla-atlas/SOURCES.md
            out/vanilla-atlas/SHA256SUMS.txt
            out/vanilla-atlas/VANILLA-ATLAS.json
          compression-level: 0
          retention-days: 7
