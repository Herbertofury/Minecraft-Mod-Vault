name: Catalog Companion Runtime

on:
  workflow_dispatch:
  push:
    branches: [mob-variety-companion-runtime]
    paths:
      - '.github/workflows/mob-variety-companion-runtime.yml'
      - 'research/mob-variety/explorer/companion/catalog-companion-v2-ci.tar.gz'

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Extract and validate 2.0 runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          cp research/mob-variety/explorer/companion/catalog-companion-v2-ci.tar.gz runtime-template.tar.gz
          sha256sum runtime-template.tar.gz
          mkdir runtime
          tar -xzf runtime-template.tar.gz -C runtime
          node --check runtime/main.js
          node --check runtime/preload.js
          node --check runtime/catalog-preload.js
          node --check runtime/catalog-manager.js
          node --check runtime/shell.js
          node --check runtime/catalog/renderer-v2.js
          node --check runtime/catalog/enhance-v2.js
          grep -q '2.0.0' runtime/package.json
          grep -q 'split-divider' runtime/shell.html
          grep -q 'pointermove' runtime/shell.js
          grep -q '__catalogGalleryEnhancerTest' runtime/catalog/enhance-v2.js
          grep -q 'catalog:import-paths' runtime/main.js

      - name: Download verified Electron 44 runtimes
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o electron-linux.zip https://github.com/electron/electron/releases/download/v44.0.0/electron-v44.0.0-linux-x64.zip
          curl -L --fail --retry 3 -o electron-windows.zip https://github.com/electron/electron/releases/download/v44.0.0/electron-v44.0.0-win32-x64.zip
          echo 'd65286d812719f2b4c1a1b806a80f288a1058c89c7b058dae1e03ab25e499446  electron-linux.zip' | sha256sum -c -
          echo 'e61aa3bcea8152bc0730abd015e47c032d778a0ef10e2a1c78ba3c4ea47942f9  electron-windows.zip' | sha256sum -c -

      - name: Real Chromium multi-catalog self-test
        shell: bash
        run: |
          set -euo pipefail
          mkdir electron-linux
          unzip -q electron-linux.zip -d electron-linux
          rm -rf electron-linux/resources/app
          mkdir -p electron-linux/resources/app
          cp -a runtime/. electron-linux/resources/app/
          chmod +x electron-linux/electron
          sudo chown root:root electron-linux/chrome-sandbox
          sudo chmod 4755 electron-linux/chrome-sandbox
          xvfb-run -a ./electron-linux/electron ./electron-linux/resources/app --self-test 2>&1 | tee runtime-self-test.log
          grep -q 'CATALOG_COMPANION_SELF_TEST' runtime-self-test.log
          grep -q '"passed":true' runtime-self-test.log

      - name: Package Windows x64 portable runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir windows
          unzip -q electron-windows.zip -d windows
          rm -rf windows/resources/app
          mkdir -p windows/resources/app
          cp -a runtime/. windows/resources/app/
          mv windows/electron.exe 'windows/Minecraft Catalog Companion.exe'
          cat > windows/README.txt <<'TXT'
          Minecraft Catalog Companion 2.0.0
          ---------------------------------
          Portable Windows x64 Chromium catalog research workspace.
          The release process replaces the CI fixture catalogs with the verified full built-ins before final delivery.
          Features include real browser tabs, a truly draggable persisted split divider, interactive/live project galleries, catalog switching, and hot-drop imports.
          TXT
          zip -q -9 -r 'Minecraft Catalog Companion - Windows x64 Runtime.zip' windows
          sha256sum 'Minecraft Catalog Companion - Windows x64 Runtime.zip' | tee windows-runtime.sha256

      - name: Upload verified Windows runtime
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-catalog-companion-windows-runtime-2-0-0
          path: |
            Minecraft Catalog Companion - Windows x64 Runtime.zip
            runtime-self-test.log
            windows-runtime.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
