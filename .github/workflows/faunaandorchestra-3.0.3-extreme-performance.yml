name: Fauna & Orchestra 3.0.3 extreme performance build

on:
  push:
    branches:
      - build/faunaandorchestra-3.0.3-extreme-performance
    paths:
      - '.ci/faunaandorchestra_3_0_3_performance_patch_v2.py'
      - '.ci/faunaandorchestra_3_0_3_extreme_patch.py'
      - '.ci/faunaandorchestra_3_0_3_extreme_safe_wave.py'
      - '.github/workflows/faunaandorchestra-3.0.3-extreme-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout exact upstream 3.0.3 source
        shell: bash
        run: |
          set -euxo pipefail
          git init fauna
          cd fauna
          git remote add origin https://github.com/migueel26/Fauna-And-Orchestra.git
          git fetch --depth=1 origin 131bdcbf76aec07267d68a57185bb103669af83e
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "131bdcbf76aec07267d68a57185bb103669af83e"

      - name: Apply verified first-pass optimization
        shell: bash
        run: |
          set -euxo pipefail
          python3 .ci/faunaandorchestra_3_0_3_performance_patch_v2.py fauna | tee first-pass-output.txt

      - name: Apply extreme Wave 2A optimization
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.ci/faunaandorchestra_3_0_3_extreme_patch.py')
          s = p.read_text(encoding='utf-8')
          old = '''remnants = [
              line.strip() for line in text.splitlines()
              if "TICKS_UNTIL_DEATH" in line or "EntityDataAccessor" in line or "EntityDataSerializers" in line
          ]'''
          new = '''remnants = [
              line.strip() for line in text.splitlines()
              if "EntityDataAccessor<Integer> TICKS_UNTIL_DEATH" in line
              or "entityData.define(TICKS_UNTIL_DEATH" in line
              or "entityData.get(TICKS_UNTIL_DEATH" in line
              or "entityData.set(TICKS_UNTIL_DEATH" in line
          ]'''
          if s.count(old) != 1:
              raise SystemExit('extreme patch guard shape changed unexpectedly')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .ci/faunaandorchestra_3_0_3_extreme_patch.py fauna | tee extreme-patch-output.txt

      - name: Apply zero-regression Floating Blossom safe wave
        shell: bash
        run: |
          set -euxo pipefail
          python3 .ci/faunaandorchestra_3_0_3_extreme_safe_wave.py fauna | tee safe-wave-output.txt
          cd fauna
          git diff --check
          git diff --stat
          git diff > ../faunaandorchestra-3.0.3-extreme-performance.patch
          cp PERFORMANCE-PATCH-REPORT.json ..
          cp EXTREME-PERFORMANCE-PATCH-REPORT.json ..
          cp EXTREME-SAFE-WAVE-REPORT.json ..

      - name: Build reobfuscated Forge jar
        working-directory: fauna
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace

      - name: Collect and verify artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          JAR="$(find fauna/build/libs -maxdepth 1 -type f -name 'faunaandorchestra-3.0.3.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" out/faunaandorchestra-forge-1.20.1-3.0.3-extreme-optimized.jar
          cp faunaandorchestra-3.0.3-extreme-performance.patch out/
          cp PERFORMANCE-PATCH-REPORT.json out/
          cp EXTREME-PERFORMANCE-PATCH-REPORT.json out/
          cp EXTREME-SAFE-WAVE-REPORT.json out/
          cp first-pass-output.txt out/
          cp extreme-patch-output.txt out/
          cp safe-wave-output.txt out/
          unzip -t out/faunaandorchestra-forge-1.20.1-3.0.3-extreme-optimized.jar | tee out/jar-integrity.txt
          unzip -p out/faunaandorchestra-forge-1.20.1-3.0.3-extreme-optimized.jar META-INF/mods.toml > out/mods.toml.extracted
          sha256sum out/faunaandorchestra-forge-1.20.1-3.0.3-extreme-optimized.jar > out/SHA256SUMS.txt
          stat -c '%n %s bytes' out/faunaandorchestra-forge-1.20.1-3.0.3-extreme-optimized.jar | tee out/ARTIFACT-SIZE.txt

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: faunaandorchestra-3.0.3-extreme-performance-build
          path: out/
          if-no-files-found: error
          retention-days: 30
