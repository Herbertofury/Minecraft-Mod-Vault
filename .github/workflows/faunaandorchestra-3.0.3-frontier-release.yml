name: Fauna & Orchestra 3.0.3 frontier release build

on:
  push:
    branches:
      - perf/faunaandorchestra-3.0.3-native-profiler
    paths:
      - '.ci/faunaandorchestra_3_0_3_frontier_release_patch.py'
      - '.ci/faunaandorchestra_3_0_3_frontier_patch.py'
      - '.ci/faunaandorchestra_3_0_3_frontier_wave3c.py'
      - '.github/workflows/faunaandorchestra-3.0.3-frontier-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout release harness
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout exact upstream 3.0.3 source
        shell: bash
        run: |
          set -euxo pipefail
          git init fauna
          cd fauna
          git remote add origin https://github.com/migueel26/Fauna-And-Orchestra.git
          git fetch --depth=1 origin 131bdcbf76aec07267d68a57185bb103669af83e
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "131bdcbf76aec07267d68a57185bb103669af83e"

      - name: Apply clean accepted frontier stack through Wave 3C
        shell: bash
        run: |
          set -euxo pipefail
          python3 .ci/faunaandorchestra_3_0_3_frontier_release_patch.py fauna | tee frontier-release-patch-output.txt
          cd fauna
          git diff --check
          test ! -d src/main/java/net/migueel26/faunaandorchestra/qa
          git diff --stat | tee ../frontier-release-diff-stat.txt
          git diff > ../faunaandorchestra-3.0.3-frontier-release.patch
          cp FRONTIER-RELEASE-PATCH-REPORT.json ..
          cp FRONTIER-PERFORMANCE-PATCH-REPORT.json ..
          cp FRONTIER-WAVE3C-REPORT.json ..

      - name: Build clean reobfuscated Forge release jar
        working-directory: fauna
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace

      - name: Collect and verify frontier release
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          JAR="$(find fauna/build/libs -maxdepth 1 -type f -name 'faunaandorchestra-3.0.3.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" out/faunaandorchestra-forge-1.20.1-3.0.3-frontier-wave3c.jar
          cp faunaandorchestra-3.0.3-frontier-release.patch out/
          cp FRONTIER-RELEASE-PATCH-REPORT.json out/
          cp FRONTIER-PERFORMANCE-PATCH-REPORT.json out/
          cp FRONTIER-WAVE3C-REPORT.json out/
          cp frontier-release-patch-output.txt out/
          cp frontier-release-diff-stat.txt out/
          unzip -t out/faunaandorchestra-forge-1.20.1-3.0.3-frontier-wave3c.jar | tee out/jar-integrity.txt
          if unzip -l out/faunaandorchestra-forge-1.20.1-3.0.3-frontier-wave3c.jar | grep -q 'net/migueel26/faunaandorchestra/qa/'; then
            echo 'QA-only classes leaked into release JAR' >&2
            exit 1
          fi
          unzip -p out/faunaandorchestra-forge-1.20.1-3.0.3-frontier-wave3c.jar META-INF/mods.toml > out/mods.toml.extracted
          sha256sum out/faunaandorchestra-forge-1.20.1-3.0.3-frontier-wave3c.jar > out/SHA256SUMS.txt
          stat -c '%n %s bytes' out/faunaandorchestra-forge-1.20.1-3.0.3-frontier-wave3c.jar | tee out/ARTIFACT-SIZE.txt

      - name: Upload frontier release evidence
        uses: actions/upload-artifact@v4
        with:
          name: faunaandorchestra-3.0.3-frontier-wave3c-release
          path: out/
          if-no-files-found: error
          retention-days: 30
