name: Snapshot Explorer Recovery Staging

on:
  push:
    paths:
      - '.github/workflows/snapshot-explorer-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Upload exact staging bytes
        uses: actions/upload-artifact@v4
        with:
          name: recommendations-explorer-staging-${{ github.sha }}
          path: .github/mrv-explorer-staging
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
