name: Ragdoll Port Inspect

on:
  push:
    branches: [ ragdoll-forge-1.20.1-port ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Ragdollified and CFR
        run: |
          mkdir -p build/inspect
          curl -fL --retry 3 -o build/inspect/ragdollified.jar 'https://edge.forgecdn.net/files/8704/143/ragdollified-1.20.1-1.0.0-RELEASE.jar'
          curl -fL --retry 3 -o build/inspect/cfr.jar 'https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar'
      - name: Inspect API and decompile
        run: |
          set -euo pipefail
          cd build/inspect
          sha256sum ragdollified.jar > REPORT.txt
          echo >> REPORT.txt
          unzip -p ragdollified.jar META-INF/mods.toml >> REPORT.txt || true
          echo '\n=== classes containing api/manager/ragdoll ===' >> REPORT.txt
          jar tf ragdollified.jar | grep -Ei '(api|manager|ragdoll)' | sort >> REPORT.txt || true
          mkdir decompiled
          java -jar cfr.jar ragdollified.jar --outputdir decompiled --silent true
          echo '\n=== candidate public methods ===' >> REPORT.txt
          grep -RInE 'public (static )?.*(ragdoll|spawn|create|apply|push|force|velocity|release|remove|despawn)' decompiled --include='*.java' | head -n 800 >> REPORT.txt || true
          echo '\n=== candidate API packages ===' >> REPORT.txt
          find decompiled -type f -name '*.java' | grep -Ei '(api|ragdoll|manager)' | sort >> REPORT.txt || true
          tar -czf decompiled-api.tar.gz decompiled
      - uses: actions/upload-artifact@v4
        with:
          name: ragdollified-api-inspection
          path: |
            build/inspect/REPORT.txt
            build/inspect/decompiled-api.tar.gz
            build/inspect/ragdollified.jar
