name: Ragdoll Port Inspect

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ragdoll-port/**'
      - '.github/workflows/ragdoll-port-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'ragdoll-forge-1.20.1-port' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact backend and CFR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/inspect
          curl -fL --retry 4 --retry-delay 2 -o build/inspect/ragdollified.jar 'https://cdn.modrinth.com/data/PMOR9v1z/versions/pxf1373R/ragdollified-1.20.1-0.7.0-BETA.jar'
          curl -fL --retry 4 --retry-delay 2 -o build/inspect/cfr.jar 'https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar'
      - name: Inspect API and decompile
        shell: bash
        run: |
          set -euo pipefail
          cd build/inspect
          sha256sum ragdollified.jar > REPORT.txt
          echo >> REPORT.txt
          unzip -p ragdollified.jar META-INF/mods.toml >> REPORT.txt || true
          echo >> REPORT.txt
          echo '=== API / manager / ragdoll classes ===' >> REPORT.txt
          jar tf ragdollified.jar | grep -Ei '(api|manager|ragdoll)' | sort >> REPORT.txt || true
          mkdir decompiled
          java -jar cfr.jar ragdollified.jar --outputdir decompiled --silent true
          echo >> REPORT.txt
          echo '=== candidate public methods ===' >> REPORT.txt
          grep -RInE 'public (static )?.*(ragdoll|spawn|create|apply|push|force|velocity|release|remove|despawn|impulse)' decompiled --include='*.java' | head -n 1200 >> REPORT.txt || true
          echo >> REPORT.txt
          echo '=== API source excerpts ===' >> REPORT.txt
          find decompiled -type f -name '*.java' | grep -Ei '(api|ragdoll|manager)' | sort | head -n 300 >> REPORT.txt || true
          tar -czf decompiled-api.tar.gz decompiled
      - uses: actions/upload-artifact@v4
        with:
          name: ragdollified-api-inspection
          path: |
            build/inspect/REPORT.txt
            build/inspect/decompiled-api.tar.gz
            build/inspect/ragdollified.jar
          retention-days: 7
