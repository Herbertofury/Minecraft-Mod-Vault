name: Fetch TFThreadSafetyAddon Official Source v2
on:
  push:
    branches:
      - repair-art-fetch-tfthreadsafetyaddon-20260908
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact upstream bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 -A Mozilla/5.0 https://api.modrinth.com/v2/project/VFGmWf7t -o out/modrinth-project.json
          curl -fL --retry 3 -A Mozilla/5.0 https://api.modrinth.com/v2/version/rVYNBGf8 -o out/modrinth-version.json
          curl -fL --retry 3 -A Mozilla/5.0 https://cdn.modrinth.com/data/VFGmWf7t/890b90c93eeb4cb6e88577bffd05db1084cf64f0.png -o out/modrinth-project-icon.png
          jq -r '.files[] | select(.primary == true) | .url' out/modrinth-version.json | head -n 1 > out/jar-url.txt
          test -s out/jar-url.txt
          curl -fL --retry 3 -A Mozilla/5.0 "$(cat out/jar-url.txt)" -o out/tfthreadsafetyaddon-forge-1.20.1-1.1.0.jar
          curl -fL --retry 3 -A Mozilla/5.0 https://www.curseforge.com/minecraft/mc-mods/fork-twilightforest-thread-safety-addon-for-forge -o out/curseforge-page.html
          sha256sum out/* > out/SHA256SUMS.txt
          file out/* > out/FILETYPES.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: tfthreadsafetyaddon-official-source-v2
          path: out/
          retention-days: 1
