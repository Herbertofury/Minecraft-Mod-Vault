name: Fauna & Orchestra 3.0.3 performance build

on:
  push:
    branches:
      - build/faunaandorchestra-3.0.3-performance
    paths:
      - '.ci/faunaandorchestra_3_0_3_performance_patch.py'
      - '.ci/faunaandorchestra_3_0_3_performance_patch_v2.py'
      - '.github/workflows/faunaandorchestra-3.0.3-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout exact upstream 3.0.3 source
        shell: bash
        run: |
          set -euxo pipefail
          git init fauna
          cd fauna
          git remote add origin https://github.com/migueel26/Fauna-And-Orchestra.git
          git fetch --depth=1 origin 131bdcbf76aec07267d68a57185bb103669af83e
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "131bdcbf76aec07267d68a57185bb103669af83e"

      - name: Apply audited performance patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 .ci/faunaandorchestra_3_0_3_performance_patch_v2.py fauna | tee performance-patch-output.txt
          cd fauna
          git diff --check
          git diff --stat
          git diff > ../faunaandorchestra-3.0.3-performance.patch
          cp PERFORMANCE-PATCH-REPORT.json ..

      - name: Build reobfuscated Forge jar
        working-directory: fauna
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace

      - name: Collect and verify artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          JAR="$(find fauna/build/libs -maxdepth 1 -type f -name 'faunaandorchestra-3.0.3.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" out/faunaandorchestra-forge-1.20.1-3.0.3-optimized.jar
          cp faunaandorchestra-3.0.3-performance.patch out/
          cp PERFORMANCE-PATCH-REPORT.json out/
          cp performance-patch-output.txt out/
          unzip -t out/faunaandorchestra-forge-1.20.1-3.0.3-optimized.jar | tee out/jar-integrity.txt
          unzip -p out/faunaandorchestra-forge-1.20.1-3.0.3-optimized.jar META-INF/mods.toml > out/mods.toml.extracted
          sha256sum out/faunaandorchestra-forge-1.20.1-3.0.3-optimized.jar > out/SHA256SUMS.txt
          stat -c '%n %s bytes' out/faunaandorchestra-forge-1.20.1-3.0.3-optimized.jar | tee out/ARTIFACT-SIZE.txt

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: faunaandorchestra-3.0.3-performance-build
          path: out/
          if-no-files-found: error
          retention-days: 30
