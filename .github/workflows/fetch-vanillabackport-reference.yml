name: Fetch VanillaBackport Reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-vanillabackport-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact Forge 1.20.1 provider
        shell: bash
        run: |
          set -euo pipefail
          FILE='VanillaBackport-forge-1.20.1-1.1.7.10.jar'
          URLS=(
            'https://www.curseforge.com/api/v1/mods/417430/files/8229712/download'
            'https://edge.forgecdn.net/files/8229/712/VanillaBackport-forge-1.20.1-1.1.7.10.jar'
            'https://mediafilez.forgecdn.net/files/8229/712/VanillaBackport-forge-1.20.1-1.1.7.10.jar'
          )
          for u in "${URLS[@]}"; do
            echo "trying $u"
            if curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 "$u" -o "$FILE"; then
              if unzip -t "$FILE" >/dev/null 2>&1; then break; fi
            fi
            rm -f "$FILE"
          done
          test -f "$FILE"
          unzip -p "$FILE" META-INF/mods.toml | tee mods.toml
          grep -qi 'vanillabackport' mods.toml
          grep -qi '1.1.7.10' mods.toml || true
          sha256sum "$FILE" | tee SHA256SUMS.txt
          stat -c '%n %s bytes' "$FILE"
          cat > FETCH-RECEIPT.txt <<EOF
          project=Vanilla Backport
          curseforge_project_id=417430
          curseforge_file_id=8229712
          minecraft=1.20.1
          loader=Forge
          version=1.1.7.10
          filename=$FILE
          fetched_utc=$(date -u +%FT%TZ)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: vanillabackport-forge-1.20.1-1.1.7.10-reference
          path: |
            VanillaBackport-forge-1.20.1-1.1.7.10.jar
            SHA256SUMS.txt
            FETCH-RECEIPT.txt
            mods.toml
          compression-level: 0
          retention-days: 7
