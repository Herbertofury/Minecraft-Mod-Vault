name: Mob Visual Metadata

on:
  push:
    paths:
      - 'tools/visual_metadata/fetch_visuals.py'
      - '.github/workflows/mob-visual-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-visual-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual tooling
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Fetch official visual metadata and build compact assets
        run: python tools/visual_metadata/fetch_visuals.py
      - name: Upload compact visual asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: mob-visual-assets-253
          path: tools/visual_metadata/build/
          if-no-files-found: error
          compression-level: 6
