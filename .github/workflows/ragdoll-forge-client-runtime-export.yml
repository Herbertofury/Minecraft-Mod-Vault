name: Ragdoll Forge 1.20.1 Client Runtime Export

on:
  push:
    branches:
      - ragdoll-sable-source-export-build-v3
    paths:
      - '.github/workflows/ragdoll-forge-client-runtime-export.yml'

permissions:
  contents: read

jobs:
  export-client-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install vanilla 1.20.1 and Forge 47.4.23 client
        shell: bash
        run: |
          set -euo pipefail
          MC=/tmp/mc
          mkdir -p "$MC"
          python -m pip install --disable-pip-version-check 'minecraft-launcher-lib>=7,<8'
          python - <<'PY'
          import json, os
          import minecraft_launcher_lib
          mc='/tmp/mc'
          minecraft_launcher_lib.install.install_minecraft_version('1.20.1', mc)
          p=os.path.join(mc,'launcher_profiles.json')
          if not os.path.exists(p):
              with open(p,'w',encoding='utf-8') as f:
                  json.dump({'profiles':{},'settings':{},'version':3},f)
          PY
          curl -fL --retry 4 --retry-delay 2 -o /tmp/forge-installer.jar \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar'
          java -jar /tmp/forge-installer.jar --installClient "$MC"
          find "$MC/versions" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
      - name: Generate portable offline launch command
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          import minecraft_launcher_lib
          mc='/tmp/mc'
          versions=sorted(os.listdir(os.path.join(mc,'versions')))
          forge=[v for v in versions if 'forge' in v.lower() and '47.4.23' in v]
          if not forge:
              raise SystemExit('Forge client version not installed: '+repr(versions))
          version=forge[-1]
          options={
              'username':'RagdollQA',
              'uuid':'00000000-0000-0000-0000-000000000001',
              'token':'0',
              'launcherName':'Minecraft-Mod-Vault-QA',
              'launcherVersion':'1',
              'jvmArguments':['-Xms1G','-Xmx4G','-Djava.awt.headless=false'],
          }
          cmd=minecraft_launcher_lib.command.get_minecraft_command(version, mc, options)
          portable=[x.replace(mc,'${MC_DIR}') for x in cmd]
          out='/tmp/mc/qa-launch'
          os.makedirs(out,exist_ok=True)
          with open(out+'/version.txt','w') as f: f.write(version+'\n')
          with open(out+'/command.json','w') as f: json.dump(portable,f,indent=2)
          print('Forge version:',version)
          print('Command args:',len(cmd))
          PY
      - name: Archive and split client runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mc/webcache* /tmp/mc/logs /tmp/mc/crash-reports /tmp/mc/saves /tmp/mc/mods /tmp/mc/config
          du -sh /tmp/mc
          tar -C /tmp -czf /tmp/forge-1.20.1-47.4.23-client-runtime.tar.gz mc
          mkdir -p /tmp/client-runtime-parts
          split -b 350M -d -a 2 /tmp/forge-1.20.1-47.4.23-client-runtime.tar.gz /tmp/client-runtime-parts/client-runtime.part-
          sha256sum /tmp/forge-1.20.1-47.4.23-client-runtime.tar.gz > /tmp/client-runtime-parts/WHOLE-SHA256SUMS.txt
          sha256sum /tmp/client-runtime-parts/client-runtime.part-* > /tmp/client-runtime-parts/PART-SHA256SUMS.txt
          ls -lh /tmp/client-runtime-parts
      - uses: actions/upload-artifact@v4
        with:
          name: forge-client-runtime-part-00
          path: |
            /tmp/client-runtime-parts/client-runtime.part-00
            /tmp/client-runtime-parts/WHOLE-SHA256SUMS.txt
            /tmp/client-runtime-parts/PART-SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: forge-client-runtime-part-01
          path: /tmp/client-runtime-parts/client-runtime.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: forge-client-runtime-part-02
          path: /tmp/client-runtime-parts/client-runtime.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
