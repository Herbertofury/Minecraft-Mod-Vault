name: Ragdoll Sable Forge Build

on:
  push:
    branches: [ ragdoll-sable-source-export-v2 ]
    paths:
      - 'sable-source-export-trigger/**'
      - '.github/workflows/ragdoll-sable-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sable-source-export-trigger/**'
      - '.github/workflows/ragdoll-sable-build.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'ragdoll-sable-source-export')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout harness branch
        uses: actions/checkout@v4
      - name: Checkout exact Sable Forge backport
        uses: actions/checkout@v4
        with:
          repository: CamelPoem32/sable-backport
          ref: 6dd48142a62347f1454559b546cbaa63eca648ac
          path: sable
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fix structurally inherited Enum ABI verifier blind spot
        shell: bash
        run: python3 sable-source-export-trigger/patch-sable-enum-abi.py
      - name: Build and verify Sable M9.19 on Forge 47.4.23
        shell: bash
        run: bash sable-source-export-trigger/build-sable-m9.19.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sable-forge-1.20.1-m9.19-build
          path: export
          if-no-files-found: error
          retention-days: 7
