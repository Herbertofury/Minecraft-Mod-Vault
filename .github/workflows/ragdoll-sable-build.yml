name: Ragdoll Sable Forge Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'sable-source-export-trigger/**'
      - '.github/workflows/ragdoll-sable-build.yml'

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.head_ref, 'ragdoll-sable-source-export')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Sable Forge backport head
        uses: actions/checkout@v4
        with:
          repository: CamelPoem32/sable-backport
          ref: 6dd48142a62347f1454559b546cbaa63eca648ac
          path: sable
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Stage exact target dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target_modpack/mods
          curl -fL --retry 4 --retry-delay 2 -o target_modpack/mods/create-1.20.1-6.0.8.jar 'https://edge.forgecdn.net/files/7178/761/create-1.20.1-6.0.8.jar'
          echo '6fbb910c367dbce8e4fc7e5bf64b6edd4de980906ed00af8e47e4af843c0d9b0  target_modpack/mods/create-1.20.1-6.0.8.jar' | sha256sum -c -
          lz4="$HOME/.gradle/caches/modules-2/files-2.1/at.yawk.lz4/lz4-java/1.11.0/b9669fb5e3ccf50a579c9a4f750cab37ce8fce1b/lz4-java-1.11.0.jar"
          mkdir -p "$(dirname "$lz4")"
          curl -fL --retry 4 --retry-delay 2 -o "$lz4" 'https://repo1.maven.org/maven2/at/yawk/lz4/lz4-java/1.11.0/lz4-java-1.11.0.jar'
          echo "535c5578cab5dcd0a438e202df80091632b873c0370c25d9b1c1ad1d73577207  $lz4" | sha256sum -c -
      - name: Rebase Forge patch to 47.4.23
        working-directory: sable
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^forge_version=47\.4\.20$/forge_version=47.4.23/' gradle.properties
          grep '^forge_version=' gradle.properties
          chmod +x gradlew
      - name: Build and verify production Sable/Rapier artifact
        working-directory: sable
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :forge:spotlessApply
          ./gradlew --no-daemon \
            :forge:verifyTargetModpackDependencies \
            :forge:verifySubLevelEntityCollisionBoundary \
            :forge:verifyBasicSubLevelRenderLifecycle \
            :forge:verifySableSpawnCommandBoundary \
            :forge:build \
            :forge:verifyRapierPackagedArtifact \
            :forge:verifyRapierProductionNamespace \
            :forge:verifyCompanionProductionNamespace \
            :forge:verifyProductionMinecraftAccessBoundary
      - name: Collect exact artifact and proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          find sable/forge/build/libs -maxdepth 1 -type f -name '*-all.jar' -print -exec cp '{}' export/ \;
          test "$(find export -type f -name '*-all.jar' | wc -l)" -ge 1
          sha256sum export/*-all.jar > export/SHA256SUMS.txt
          printf '%s\n' 'source=6dd48142a62347f1454559b546cbaa63eca648ac' 'forge=47.4.23' 'create_sha256=6fbb910c367dbce8e4fc7e5bf64b6edd4de980906ed00af8e47e4af843c0d9b0' > export/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sable-forge-1.20.1-m9.19-build
          path: export
          if-no-files-found: error
          retention-days: 7
