name: Backpacks QA Minecraft 1.20.1 Assets

on:
  push:
    branches:
      - backpacks-qa-platform-fetch-20260907

permissions:
  contents: read

jobs:
  client-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official 1.20.1 assets and Linux natives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,shutil,urllib.request,zipfile
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          root=Path('client-runtime'); assets=root/'assets'; natives=root/'natives'
          (assets/'indexes').mkdir(parents=True,exist_ok=True); (assets/'objects').mkdir(parents=True,exist_ok=True); natives.mkdir(parents=True,exist_ok=True)
          def getj(url):
              with urllib.request.urlopen(url,timeout=60) as r:return json.load(r)
          manifest=getj('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json')
          v=next(x for x in manifest['versions'] if x['id']=='1.20.1')
          meta=getj(v['url']); (root/'version-1.20.1.json').write_text(json.dumps(meta,indent=2))
          ai=meta['assetIndex']; index=getj(ai['url']); (assets/'indexes'/f"{ai['id']}.json").write_text(json.dumps(index,separators=(',',':')))
          def dl_obj(item):
              name,o=item; h=o['hash']; dst=assets/'objects'/h[:2]/h
              if dst.exists() and dst.stat().st_size==o['size']: return
              dst.parent.mkdir(parents=True,exist_ok=True)
              urllib.request.urlretrieve(f'https://resources.download.minecraft.net/{h[:2]}/{h}',dst)
          with ThreadPoolExecutor(max_workers=32) as ex:list(ex.map(dl_obj,index['objects'].items()))
          tmp=Path('native-jars'); tmp.mkdir(exist_ok=True)
          for lib in meta['libraries']:
              d=lib.get('downloads',{}); cls=d.get('classifiers',{})
              ent=cls.get('natives-linux')
              if not ent: continue
              fn=tmp/Path(ent['path']).name
              urllib.request.urlretrieve(ent['url'],fn)
              with zipfile.ZipFile(fn) as z:
                  for n in z.namelist():
                      base=Path(n).name
                      if base.endswith('.so'):
                          with z.open(n) as src, open(natives/base,'wb') as dst: shutil.copyfileobj(src,dst)
          import hashlib
          bad=[]
          for name,o in index['objects'].items():
              h=o['hash']; p=assets/'objects'/h[:2]/h
              if not p.exists() or p.stat().st_size!=o['size'] or hashlib.sha1(p.read_bytes()).hexdigest()!=h: bad.append(name)
          if bad: raise SystemExit(f'bad asset objects: {bad[:10]} count={len(bad)}')
          summary={'asset_index':ai['id'],'objects':len(index['objects']),'natives':sorted(p.name for p in natives.glob('*.so'))}
          (root/'QA-RUNTIME-MANIFEST.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
          # Transport-only sharding: preserve exact assets/objects/XX/hash layout.
          mkdir -p shards/meta/assets/indexes shards/meta/natives
          cp -a client-runtime/assets/indexes/. shards/meta/assets/indexes/
          cp -a client-runtime/natives/. shards/meta/natives/
          cp -a client-runtime/version-1.20.1.json client-runtime/QA-RUNTIME-MANIFEST.json shards/meta/
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          src=Path('client-runtime/assets/objects')
          ranges=[(0x00,0x1f),(0x20,0x3f),(0x40,0x5f),(0x60,0x7f),(0x80,0x9f),(0xa0,0xbf),(0xc0,0xdf),(0xe0,0xff)]
          for a,b in ranges:
              root=Path('shards')/f'{a:02x}-{b:02x}'/'assets'/'objects'
              root.mkdir(parents=True,exist_ok=True)
              for i in range(a,b+1):
                  p=f'{i:02x}'; s=src/p
                  if s.exists(): shutil.copytree(s,root/p,copy_function=os.link)
          PY
          du -sh client-runtime shards/*
      - name: Upload metadata and Linux natives
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-assets-meta-natives
          path: shards/meta/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload asset objects 00-1f
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-assets-00-1f
          path: shards/00-1f/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload asset objects 20-3f
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-assets-20-3f
          path: shards/20-3f/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload asset objects 40-5f
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-assets-40-5f
          path: shards/40-5f/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload asset objects 60-7f
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-assets-60-7f
          path: shards/60-7f/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload asset objects 80-9f
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-assets-80-9f
          path: shards/80-9f/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload asset objects a0-bf
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-assets-a0-bf
          path: shards/a0-bf/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload asset objects c0-df
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-assets-c0-df
          path: shards/c0-df/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload asset objects e0-ff
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-assets-e0-ff
          path: shards/e0-ff/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
