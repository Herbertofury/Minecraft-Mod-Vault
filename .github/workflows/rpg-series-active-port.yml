name: RPG Series - Active Native Forge 1.20.1 Port

on:
  pull_request:
    branches: [main]
    paths:
      - 'rpg-series-port/**'
      - '.github/workflows/rpg-series-active-port.yml'

concurrency:
  group: rpg-series-active-port-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-active-port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Run active RPG port verifier from PR head
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_FILE='rpg-series-port/ci/ACTIVE_RUNNER'
          test -f "$ACTIVE_FILE"
          RUNNER="$(tr -d '\r\n ' < "$ACTIVE_FILE")"
          case "$RUNNER" in
            run-*.sh) ;;
            *) echo "Invalid active runner: $RUNNER" >&2; exit 2 ;;
          esac
          SCRIPT="rpg-series-port/ci/$RUNNER"
          test -f "$SCRIPT"
          echo "[RPG CI] Active runner: $SCRIPT"
          bash "$SCRIPT"

      - name: Preserve active-port evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-series-active-port-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            rpg-series-port/*/forge/build/libs/*.jar
            rpg-series-port/*/generated/forge/build/libs/*.jar
            rpg-series-port/*/*.jar
            rpg-series-port/*/*sha256
            rpg-series-port/*/*smoke.log
            *-source-ci.zip
