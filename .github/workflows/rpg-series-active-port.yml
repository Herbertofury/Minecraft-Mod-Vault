name: RPG Series - Active Native Forge 1.20.1 Port

on:
  pull_request:
    branches: [main]
    paths:
      - 'rpg-series-port/**'
      - '.github/workflows/rpg-series-active-port.yml'

concurrency:
  group: rpg-series-active-port-workbench-rpg-series-forge-1.20.1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-active-port:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Run active RPG port verifier from exact head
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_FILE='rpg-series-port/ci/ACTIVE_RUNNER'
          LOG='rpg-series-port/active-port-verifier.log'
          test -f "$ACTIVE_FILE"
          RUNNER="$(tr -d '\r\n ' < "$ACTIVE_FILE")"
          case "$RUNNER" in
            run-*.sh) ;;
            *) echo "Invalid active runner: $RUNNER" >&2; exit 2 ;;
          esac
          SCRIPT="rpg-series-port/ci/$RUNNER"
          test -f "$SCRIPT"
          echo "[RPG CI] Active runner: $SCRIPT" | tee "$LOG"
          bash "$SCRIPT" 2>&1 | tee -a "$LOG"

      - name: Verify More RPG packaged ownership and manifest
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='rpg-series-port/ci/verify-more-rpg-external-school-ownership.sh'
          test -f "$SCRIPT"
          bash -n "$SCRIPT"
          bash "$SCRIPT" | tee 'rpg-series-port/more-rpg-package-ownership.log'

      - name: Run More RPG Stage-1 native runtime graduation
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='rpg-series-port/ci/run-more-rpg-library-runtime-stage1.sh'
          LOG='rpg-series-port/more-rpg-runtime-stage1.log'
          test -f "$SCRIPT"
          bash -n "$SCRIPT"
          echo "[RPG CI] Runtime gate: $SCRIPT" | tee "$LOG"
          bash "$SCRIPT" 2>&1 | tee -a "$LOG"

      - name: Prove More RPG same-save restart persistence
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='rpg-series-port/ci/run-more-rpg-library-restart-persistence.sh'
          test -f "$SCRIPT"
          bash -n "$SCRIPT"
          bash "$SCRIPT" 2>&1 | tee 'rpg-series-port/more-rpg-restart-persistence.log'

      - name: Prove More RPG transformed HUD on native mapped client
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='rpg-series-port/ci/run-more-rpg-library-hud-transform-proof.sh'
          test -f "$SCRIPT"
          bash -n "$SCRIPT"
          bash "$SCRIPT" 2>&1 | tee 'rpg-series-port/more-rpg-hud-transform-proof.log'

      - name: Preserve transformed mapped-client HUD bytecode
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='rpg-series-port/ci/preserve-more-rpg-transformed-hud-evidence.sh'
          test -f "$SCRIPT"
          bash -n "$SCRIPT"
          bash "$SCRIPT" | tee 'rpg-series-port/more-rpg-hud-evidence-preserve.log'

      - name: Run More RPG production Forge SRG client gate
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='rpg-series-port/ci/run-more-rpg-library-production-client.sh'
          test -f "$SCRIPT"
          bash -n "$SCRIPT"
          bash "$SCRIPT" 2>&1 | tee 'rpg-series-port/more-rpg-production-client-gate.log'

      - name: Preserve active-port evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-series-active-port-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            rpg-series-port/active-port-verifier.log
            rpg-series-port/more-rpg-package-ownership.log
            rpg-series-port/more-rpg-runtime-stage1.log
            rpg-series-port/more-rpg-restart-persistence.log
            rpg-series-port/more-rpg-hud-transform-proof.log
            rpg-series-port/more-rpg-hud-evidence-preserve.log
            rpg-series-port/more-rpg-production-client-gate.log
            rpg-series-integration-client.log
            rpg-series-integration-server.log
            rpg-series-port/rogues-forge-1.20.1/forge/run/logs/latest.log
            rpg-series-port/paladins-forge-1.20.1/.fresh-paladins-forge-server/logs/latest.log
            rpg-series-port/more-rpg-library-forge-1.20.1/more-rpg-packaged-server-smoke.log
            rpg-series-port/more-rpg-library-forge-1.20.1/more-rpg-native-client-integrated.log
            rpg-series-port/more-rpg-library-forge-1.20.1/more-rpg-restart-persistence-client.log
            rpg-series-port/more-rpg-library-forge-1.20.1/more-rpg-hud-transform-client.log
            rpg-series-port/more-rpg-library-forge-1.20.1/more-rpg-production-client.log
            rpg-series-port/more-rpg-library-forge-1.20.1/more-rpg-production-client-install.log
            rpg-series-port/more-rpg-library-forge-1.20.1/transformed-hud-evidence/**
            rpg-series-port/more-rpg-library-forge-1.20.1/production-transformed-hud-evidence/**
            rpg-series-port/more-rpg-library-forge-1.20.1/.fresh-more-rpg-server/logs/latest.log
            .more-rpg-library-build/forge/run/logs/latest.log
            rpg-series-port/*/forge/build/libs/*.jar
            rpg-series-port/*/generated/forge/build/libs/*.jar
            rpg-series-port/*/*.jar
            rpg-series-port/*/*sha256
            rpg-series-port/*/*smoke.log
            *-source-ci.zip
