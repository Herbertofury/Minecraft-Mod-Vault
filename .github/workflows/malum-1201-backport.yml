name: Malum 1.8.2 -> Forge 1.20.1 Backport Gate

on:
  workflow_dispatch:
  push:
    branches:
      - build/malum-1.9.0-forge-1.20.1-backport
    paths:
      - 'projects/malum-1.20.1-backport/**'
      - '.github/workflows/malum-1201-backport.yml'

permissions:
  contents: read

jobs:
  release-parity-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Keep source inventory quiet and deterministic
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.safecrlf false

      - name: Prepare pinned 1.8.2 release-parity port and compile
        id: gate
        continue-on-error: true
        shell: bash
        run: bash projects/malum-1.20.1-backport/prepare-port.sh

      - name: Apply proven Forge 1.20 owners and recompile
        id: owner_bridge
        continue-on-error: true
        shell: bash
        run: |
          REPORT_DIR="$GITHUB_WORKSPACE/projects/malum-1.20.1-backport/reports"
          PORT="$GITHUB_WORKSPACE/.malum-port-work/port"
          python3 .ci/malum/apply-forge120-owner-bridges.py "$PORT/src/main/java"
          set +e
          (
            cd "$PORT"
            ./gradlew --no-daemon compileJava --stacktrace --console=plain
          ) > "$REPORT_DIR/compile.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$REPORT_DIR/compile-exit-code.txt"
          grep -E '(^|: )error:|cannot find symbol|does not exist|incompatible types|no suitable method|method .* cannot be applied' \
            "$REPORT_DIR/compile.log" > "$REPORT_DIR/error-index.txt" || true
          exit "$status"

      - name: Emit compact semantic compiler map
        if: always()
        shell: bash
        run: |
          echo '=== MALUM_SEMANTIC_MAP_BEGIN ==='
          echo '-- residual future-version surfaces --'
          if [[ -f projects/malum-1.20.1-backport/reports/residual-surfaces.txt ]]; then
            sed -n '1,160p' projects/malum-1.20.1-backport/reports/residual-surfaces.txt
          else
            echo 'residual-surfaces.txt missing'
          fi
          echo '-- compiler error index after Forge 1.20 owner bridge --'
          if [[ -f projects/malum-1.20.1-backport/reports/error-index.txt ]]; then
            sed -n '1,260p' projects/malum-1.20.1-backport/reports/error-index.txt
          else
            echo 'error-index.txt missing'
          fi
          echo '=== MALUM_SEMANTIC_MAP_END ==='

      - name: Publish compact gate summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Malum Forge 1.20.1 backport gate'
            echo
            if [[ -f projects/malum-1.20.1-backport/reports/inventory.txt ]]; then
              echo '```text'
              cat projects/malum-1.20.1-backport/reports/inventory.txt
              echo '```'
            fi
            if [[ -f projects/malum-1.20.1-backport/reports/residual-surfaces.txt ]]; then
              echo '### Residual 1.21 surfaces'
              echo '```text'
              cat projects/malum-1.20.1-backport/reports/residual-surfaces.txt
              echo '```'
            fi
            if [[ -f projects/malum-1.20.1-backport/reports/error-index.txt ]]; then
              echo '### First semantic compile errors after owner bridge (first 120 lines)'
              echo '```text'
              sed -n '1,120p' projects/malum-1.20.1-backport/reports/error-index.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compiler and delta evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malum-1.8.2-forge-1.20.1-gate
          path: projects/malum-1.20.1-backport/reports/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce compile gate
        if: always()
        shell: bash
        run: |
          test -f projects/malum-1.20.1-backport/reports/compile-exit-code.txt
          test "$(cat projects/malum-1.20.1-backport/reports/compile-exit-code.txt)" = "0"
