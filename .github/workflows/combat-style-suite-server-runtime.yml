name: Combat Style Suite Production Forge Server

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/combat-style-suite-server-runtime.yml'
      - 'combat-style-suite-5way-qa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-server:
    if: startsWith(github.head_ref, 'combat-style-suite-5way-qa-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Forge 1.20.1 47.4.23 production dedicated server
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/css5-server"
          mkdir -p "$ROOT/mods"
          cd "$ROOT"
          curl -fL --retry 5 --retry-all-errors -o forge-installer.jar \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar'
          java -jar forge-installer.jar --installServer > install.log 2>&1
          rm -f forge-installer.jar forge-installer.jar.log
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          level-name=css5_perf_world
          level-type=minecraft:flat
          generate-structures=false
          spawn-protection=0
          view-distance=6
          simulation-distance=6
          max-tick-time=-1
          sync-chunk-writes=false
          enable-command-block=true
          EOF

      - name: Fetch exact full nominal stack and profilers
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/css5-server"
          fetch_url(){ local url="$1" out="$2"; curl -fL --retry 5 --retry-all-errors --retry-delay 2 -A 'Minecraft-Dev-Kit-CSS5-Server-QA/5.0.0' "$url" -o "$ROOT/mods/$out"; test -s "$ROOT/mods/$out"; }
          modrinth_version(){ local id="$1" out="$2" json url; json="$(curl -fsSL --retry 4 -A 'Minecraft-Dev-Kit-CSS5-Server-QA/5.0.0' "https://api.modrinth.com/v2/version/$id")"; url="$(jq -r '.files[] | select(.primary == true) | .url' <<<"$json" | head -1)"; fetch_url "$url" "$out"; }
          modrinth_latest(){ local project="$1" regex="$2" out="$3" api json chosen url; api="https://api.modrinth.com/v2/project/$project/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22forge%22%5D"; json="$(curl -fsSL --retry 4 -A 'Minecraft-Dev-Kit-CSS5-Server-QA/5.0.0' "$api")"; chosen="$(jq -r --arg re "$regex" '[.[] | select(.version_number | test($re; "i"))][0].id // empty' <<<"$json")"; [ -n "$chosen" ] || chosen="$(jq -r '.[0].id // empty' <<<"$json")"; url="$(curl -fsSL -A 'Minecraft-Dev-Kit-CSS5-Server-QA/5.0.0' "https://api.modrinth.com/v2/version/$chosen" | jq -r '.files[] | select(.primary == true) | .url' | head -1)"; fetch_url "$url" "$out"; }
          fetch_url 'https://mediafilez.forgecdn.net/files/8049/910/epic-fight-20.14.17-mc1.20.1-forge.jar' 'epic-fight-20.14.17-mc1.20.1-forge.jar'
          modrinth_version 'rnhiaw3t' 'bettercombat-forge-1.9.0+1.20.1.jar'
          modrinth_version 'Zqooxsd2' 'ysm-2.6.5-forge+mc1.20.1-release.jar'
          modrinth_version 'RC3kKPlO' 'punchy-2.7d-forge-1.20.1.jar'
          fetch_url 'https://mediafilez.forgecdn.net/files/8141/310/tacz-1.20.1-1.1.8-hotfix.jar' 'tacz-1.20.1-1.1.8-hotfix.jar'
          modrinth_latest 'playeranimator' '1\\.0\\.2.*1\\.20' 'player-animation-lib-forge-1.0.2-rc1+1.20.jar'
          modrinth_latest 'cloth-config' '^11\\.1\\.' 'cloth-config-forge-1.20.1.jar'
          modrinth_latest 'spark' '^1\\.10\\.53' 'spark-1.10.53-forge.jar'
          modrinth_latest 'observable' '^4\\.4\\.2' 'observable-4.4.2-forge.jar'
          modrinth_latest 'architectury-api' '^9\\.' 'architectury-forge-1.20.1.jar'
          modrinth_latest 'kotlin-for-forge' '.*' 'kotlin-for-forge-1.20.1.jar'
          cd "$ROOT/mods"
          echo '69566cf70ae2d91d3f2564c608f014c87e290cef6215c2a27719851165485f73  epic-fight-20.14.17-mc1.20.1-forge.jar' | sha256sum -c -
          echo '49c69dccf2c641246b4e3deca81ebac21f0ee119e81fc713b838b8e33569eea1  bettercombat-forge-1.9.0+1.20.1.jar' | sha256sum -c -
          echo '25b5e902b96f4c298690208f8b433cbc31737c23f87590354dbd86f00207bc8f  ysm-2.6.5-forge+mc1.20.1-release.jar' | sha256sum -c -
          echo '27234cac35eda3b2c16cd9b7a594534f4d417065c40810307a09c1ecaf9225aa  punchy-2.7d-forge-1.20.1.jar' | sha256sum -c -
          echo '9ed8ada1283ed7a793a70cc1b51c4a340f367ce84707e1a7b8cf21ee3d288d77  tacz-1.20.1-1.1.8-hotfix.jar' | sha256sum -c -
          sha256sum *.jar | sort -k2 > "$ROOT/UPSTREAM-SHA256SUMS.txt"

      - name: Real dedicated-server baseline boot
        id: boot
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/css5-server"
          cd "$ROOT"
          set +e
          timeout --signal=INT 150s ./run.sh nogui > baseline-server.log 2>&1
          rc=$?
          set -e
          echo "server_exit=$rc" | tee baseline-server-exit.txt
          tail -500 baseline-server.log || true
          LOG="$ROOT/logs/latest.log"
          [ -s "$LOG" ] && cp "$LOG" latest-server.log
          grep -E 'Done \([0-9.]+s\)!' "$LOG"
          if grep -Eiq 'ModLoadingException|Failed to create mod instance|Mixin apply failed|Exception in server tick loop|Encountered an unexpected exception' "$LOG"; then
            echo 'Dedicated server log contains release-blocking failure' >&2
            exit 1
          fi
          # timeout 124 or clean shutdown 0/130 are accepted only after the Done marker above.
          case "$rc" in 0|124|130) ;; *) exit "$rc";; esac

      - name: Upload server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-style-suite-production-server-diagnostics
          path: |
            ${{ runner.temp }}/css5-server/install.log
            ${{ runner.temp }}/css5-server/baseline-server.log
            ${{ runner.temp }}/css5-server/baseline-server-exit.txt
            ${{ runner.temp }}/css5-server/latest-server.log
            ${{ runner.temp }}/css5-server/UPSTREAM-SHA256SUMS.txt
            ${{ runner.temp }}/css5-server/crash-reports
          if-no-files-found: warn
          retention-days: 5

      - name: Seal warmed dedicated-server runtime
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/css5-server"
          rm -rf "$ROOT/logs" "$ROOT/crash-reports"
          cd "$RUNNER_TEMP"
          tar --zstd -cf combat-style-suite-production-server-runtime.tar.zst css5-server
          sha256sum combat-style-suite-production-server-runtime.tar.zst > combat-style-suite-production-server-runtime.tar.zst.sha256
      - name: Upload warmed dedicated-server runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: combat-style-suite-production-server-runtime
          path: |
            ${{ runner.temp }}/combat-style-suite-production-server-runtime.tar.zst
            ${{ runner.temp }}/combat-style-suite-production-server-runtime.tar.zst.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
