name: Mob Delta Visual Metadata

on:
  push:
    paths:
      - 'research/mob-variety/fourth-scour-2026-08-24-candidates.json'
      - 'tools/visual_metadata/fetch_delta_visuals.py'
      - 'tools/visual_metadata/fetch_visuals.py'
      - '.github/workflows/mob-delta-visual-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-delta-visual-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual tooling
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Fetch official delta visual metadata and compact assets
        run: python tools/visual_metadata/fetch_delta_visuals.py
      - name: Upload compact fourth-scour visual asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: mob-visual-assets-fourth-scour-52
          path: tools/visual_metadata/build_delta/
          if-no-files-found: error
          compression-level: 6
