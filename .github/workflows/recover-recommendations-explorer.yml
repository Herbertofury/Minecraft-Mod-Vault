name: Recover Recommendations Explorer

on:
  push:
    paths:
      - '.github/mrv-explorer-staging/**'
      - '.github/workflows/recover-recommendations-explorer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-recommendations-explorer
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct verified Explorer and reproducible builder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/recommendations-explorer .github/recovery-diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma, string, sys, traceback

          EXPECTED_SIZE = 374830
          EXPECTED_SHA = 'e8a758034b51160515a51c7624cfa96e3a0e48341cd475940dedfea210c13d4b'
          EXPECTED_BUILDER_SIZE = 23550
          ALPHABET = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'
          FINAL = Path('Minecraft Recommendations Vault - Explorer.html')
          MANIFEST = Path('Minecraft Recommendations Vault - Explorer.build.json')
          DIAG = {'schema':'mrv.recommendations-explorer-recovery-diagnostic/6','expectedHtmlBytes':EXPECTED_SIZE,'expectedHtmlSha256':EXPECTED_SHA,'expectedBuilderBytes':EXPECTED_BUILDER_SIZE,'parts':[]}

          def clean(s): return ''.join(s.split())
          def b64decode_relaxed(s):
              s = clean(s)
              if len(s) % 4 == 1: raise ValueError(f'invalid base64 length modulo 4: {len(s)}')
              return base64.b64decode(s + '=' * ((4-len(s)%4)%4), validate=False)
          def full_verify(s):
              try: data = lzma.decompress(b64decode_relaxed(s))
              except Exception: return None
              return data if len(data)==EXPECTED_SIZE and hashlib.sha256(data).hexdigest()==EXPECTED_SHA else None
          def first_error(s):
              dec=lzma.LZMADecompressor(); upto=len(s)-len(s)%4
              for pos in range(0,upto,4):
                  try: dec.decompress(base64.b64decode(s[pos:pos+4],validate=True))
                  except Exception as exc: return pos,type(exc).__name__,str(exc)
                  if dec.eof: return pos+4,'EOF','decoder reached EOF'
              return upto,'NO_ERROR','no error before incomplete tail'
          def prefix_survives(candidate, probe_end):
              prefix=candidate[:probe_end]
              prefix=prefix[:len(prefix)-len(prefix)%4]
              try:
                  dec=lzma.LZMADecompressor(); dec.decompress(base64.b64decode(prefix,validate=True)); return True
              except Exception: return False
          def insert_one_missing_char(current, final_step=False):
              approx,etype,etext=first_error(current)
              for span in (2048,512,128,32):
                  lo=max(0,approx-span); hi=min(approx+16,len(current))
                  probe_end=len(current)+1 if final_step else min(len(current)+1,approx+span)
                  survivors=[]; attempts=0
                  for pos in range(hi,lo-1,-1):
                      for ch in ALPHABET:
                          attempts+=1; candidate=current[:pos]+ch+current[pos:]
                          if not prefix_survives(candidate,probe_end): continue
                          maybe=full_verify(candidate)
                          if maybe is not None:
                              return candidate,maybe,{'insertPosition':pos,'insertedCharacter':ch,'approxCorruptionPosition':approx,'span':span,'attempts':attempts,'nextError':'VERIFIED_FULL'}
                          if not final_step:
                              nextpos,nexttype,_=first_error(candidate)
                              survivors.append((nextpos,pos,ch,candidate,nexttype))
                  if survivors:
                      nextpos,pos,ch,candidate,nexttype=max(survivors,key=lambda item:item[0])
                      return candidate,None,{'insertPosition':pos,'insertedCharacter':ch,'approxCorruptionPosition':approx,'span':span,'attempts':attempts,'nextErrorPosition':nextpos,'nextErrorType':nexttype,'survivors':len(survivors)}
              return None,None,{'approxCorruptionPosition':approx,'errorType':etype,'error':etext,'result':'NO_SURVIVOR'}

          try:
              staging=Path('.github/mrv-explorer-staging')
              if not staging.exists():
                  if not FINAL.is_file() or not MANIFEST.is_file(): raise RuntimeError('staging absent and no exact published Explorer exists')
                  existing=FINAL.read_bytes()
                  if len(existing)!=EXPECTED_SIZE or hashlib.sha256(existing).hexdigest()!=EXPECTED_SHA: raise RuntimeError('published Explorer fails exact verification')
                  print('Exact Explorer already published; healthy cleanup no-op.'); sys.exit(0)

              parts=[]
              for i in range(7):
                  p=staging/f'xzstage-{i:02d}.b64'; raw=p.read_text(encoding='utf-8'); c=clean(raw)
                  DIAG['parts'].append({'name':p.name,'fileBytes':p.stat().st_size,'cleanBase64Chars':len(c),'cleanModulo4':len(c)%4,'sha256':hashlib.sha256(raw.encode()).hexdigest()}); parts.append(c)
              joined=''.join(parts); DIAG['joinedBase64Chars']=len(joined); DIAG['joinedModulo4']=len(joined)%4
              html=full_verify(joined); repair=None

              missing=(-len(joined))%4
              if html is None and missing in (1,2,3):
                  DIAG['inferredMissingBase64Chars']=missing
                  current=joined; steps=[]
                  for index in range(missing):
                      candidate,maybe,step=insert_one_missing_char(current,final_step=(index==missing-1))
                      steps.append(step)
                      if candidate is None: break
                      current=candidate
                      if maybe is not None:
                          html=maybe; joined=current; break
                  if html is None and len(current)%4==0:
                      html=full_verify(current)
                      if html is not None: joined=current
                  if html is not None:
                      repair={'kind':'missing-base64-characters','count':missing,'steps':steps}
                  DIAG['multiCharacterRepairSteps']=steps

              if html is None and len(joined)%4==1:
                  approx,etype,etext=first_error(joined); DIAG['firstObservedCorruptGroupStart']=approx; DIAG['firstObservedCorruptGroupErrorType']=etype; DIAG['firstObservedCorruptGroupError']=etext
                  lo=max(0,approx-2048); hi=min(approx+16,len(joined)); probe_end=min(len(joined)+1,approx+2048)
                  DIAG['searchRange']=[lo,hi]; DIAG['prefixProbeEnd']=probe_end
                  attempts=survivors=0
                  for pos in range(hi,lo-1,-1):
                      for ch in ALPHABET:
                          attempts+=1; candidate=joined[:pos]+ch+joined[pos:]
                          if not prefix_survives(candidate,probe_end): continue
                          survivors+=1; maybe=full_verify(candidate)
                          if maybe is not None:
                              html=maybe; repair={'kind':'single-missing-base64-character','insertPosition':pos,'insertedCharacter':ch,'approxCorruptionPosition':approx,'attempts':attempts,'prefixSurvivors':survivors}; break
                      if html is not None: break
                  DIAG['searchAttempts']=attempts; DIAG['prefixSurvivors']=survivors
              if html is None: raise RuntimeError('exact Explorer not recovered after verified multi-character repair search')

              DIAG['repair']=repair or {'kind':'none'}; DIAG['actualHtmlBytes']=len(html); DIAG['actualHtmlSha256']=hashlib.sha256(html).hexdigest(); DIAG['result']='PASS'; FINAL.write_bytes(html)
              builder=lzma.decompress(b64decode_relaxed((staging/'builder.py.xz.b64').read_text(encoding='utf-8'))); DIAG['actualBuilderBytes']=len(builder); DIAG['actualBuilderSha256']=hashlib.sha256(builder).hexdigest()
              if len(builder)!=EXPECTED_BUILDER_SIZE: raise RuntimeError(f'builder size mismatch: {len(builder)} != {EXPECTED_BUILDER_SIZE}')
              Path('tools/recommendations-explorer/build_recommendations_explorer.py').write_bytes(builder)
          except Exception as exc:
              DIAG['result']='FAIL'; DIAG['errorType']=type(exc).__name__; DIAG['error']=str(exc); DIAG['traceback']=traceback.format_exc(limit=8)
              Path('/tmp/recommendations-explorer-recovery-diagnostic.json').write_text(json.dumps(DIAG,indent=2,sort_keys=True)+'\n',encoding='utf-8'); print(json.dumps(DIAG,indent=2,sort_keys=True)); sys.exit(1)
          Path('/tmp/recommendations-explorer-recovery-diagnostic.json').write_text(json.dumps(DIAG,indent=2,sort_keys=True)+'\n',encoding='utf-8'); print(json.dumps(DIAG,indent=2,sort_keys=True))
          PY

          cat > "Minecraft Recommendations Vault - Explorer.build.json" <<'JSON'
          {
            "artifact": "Minecraft Recommendations Vault - Explorer.html",
            "artifactBytes": 374830,
            "artifactSha256": "e8a758034b51160515a51c7624cfa96e3a0e48341cd475940dedfea210c13d4b",
            "sourceWorkbook": "Minecraft Recommendations Vault — Master Tracker",
            "sourceWorkbookBytes": 208292,
            "sourceWorkbookSha256": "b38a46a8967e1c6e51a34f366b7142a26723e566d9157f1ff4a977e484b68125",
            "sourceDriveId": "1N5rGN1E6jk3LMcPLNoRVWi3-8QmFtOikBguvoCaAMMg",
            "sourceModifiedTime": "2026-08-29T22:28:18.260Z",
            "generatorVersion": "recommendations-explorer/1.0.0",
            "builtAt": "2026-08-29T23:28:02.395047Z",
            "sheetCount": 14,
            "sourceRowCount": 587,
            "masterItemCount": 186
          }
          JSON
          cat > tools/recommendations-explorer/README.md <<'MD'
          # Recommendations Vault Explorer builder
          `build_recommendations_explorer.py` regenerates the single-file Explorer from an `.xlsx` export of the canonical Google Sheet `Minecraft Recommendations Vault — Master Tracker`, emits provenance, and uses no dataset caps or viewport culling.
          MD
          rm -rf .github/mrv-explorer-staging
          rm -f .github/recovery-diagnostics/recommendations-explorer.json

      - name: Publish exact reconstructed bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A; if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified Recommendations Vault Explorer'; git push

      - name: Persist fail-closed recovery diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/recommendations-explorer-recovery-diagnostic.json ]; then exit 0; fi
          mkdir -p .github/recovery-diagnostics; cp /tmp/recommendations-explorer-recovery-diagnostic.json .github/recovery-diagnostics/recommendations-explorer.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/recovery-diagnostics/recommendations-explorer.json; if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Recommendations Explorer recovery failure diagnostics'; git push
