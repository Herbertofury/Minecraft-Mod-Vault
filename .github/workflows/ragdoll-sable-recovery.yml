name: Ragdoll Sable Recovery

on:
  push:
    branches:
      - ragdoll-recovery
    paths:
      - '.github/workflows/ragdoll-sable-recovery.yml'
      - 'verification/ragdoll-forge-1.20.1/recovery/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-sable-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Sable 2.0.0 lineage
        uses: actions/checkout@v4
        with:
          repository: ryanhcode/sable
          ref: b7226222caf4eace63a708bdcd73ef36c971137d
          path: sable-upstream
          fetch-depth: 1

      - name: Checkout exact Sable Companion 1.6.0 lineage
        uses: actions/checkout@v4
        with:
          repository: ryanhcode/sable-companion
          ref: 652ecf0e051846f3a433dd20126dd4d64ec3793a
          path: sable-companion-upstream
          fetch-depth: 1

      - name: Verify immutable source identities
        shell: bash
        run: |
          set -euo pipefail
          sable_actual="$(git -C sable-upstream rev-parse HEAD)"
          sable_expected="b7226222caf4eace63a708bdcd73ef36c971137d"
          companion_actual="$(git -C sable-companion-upstream rev-parse HEAD)"
          companion_expected="652ecf0e051846f3a433dd20126dd4d64ec3793a"
          test "$sable_actual" = "$sable_expected"
          test "$companion_actual" = "$companion_expected"
          grep -Eq '^version[[:space:]]*=[[:space:]]*1\.6\.0$' sable-companion-upstream/gradle.properties
          printf '%s\n' "$sable_actual" > SABLE-UPSTREAM-COMMIT.txt
          printf '%s\n' "$companion_actual" > SABLE-COMPANION-UPSTREAM-COMMIT.txt
          git -C sable-upstream status --porcelain=v1 > SABLE-UPSTREAM-STATUS.txt
          git -C sable-companion-upstream status --porcelain=v1 > SABLE-COMPANION-UPSTREAM-STATUS.txt
          test ! -s SABLE-UPSTREAM-STATUS.txt
          test ! -s SABLE-COMPANION-UPSTREAM-STATUS.txt

      - name: Package exact upstream source snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sable-upstream/.git sable-companion-upstream/.git
          python3 - <<'PY'
          import os, zipfile
          epoch=(2020,1,1,0,0,0)
          for root,out in [
              ('sable-upstream','sable-mc1.21.1-2.0.0-neoforge-b7226222-source.zip'),
              ('sable-companion-upstream','sable-companion-1.6.0-652ecf0e-source.zip'),
          ]:
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for base, dirs, files in os.walk(root):
                      dirs.sort(); files.sort()
                      for name in files:
                          p=os.path.join(base,name)
                          arc=p.replace(os.sep,'/')
                          info=zipfile.ZipInfo(arc, epoch)
                          info.compress_type=zipfile.ZIP_DEFLATED
                          info.external_attr=(0o100644 & 0xFFFF) << 16
                          with open(p,'rb') as f: z.writestr(info,f.read())
          PY
          sha256sum sable-mc1.21.1-2.0.0-neoforge-b7226222-source.zip > SABLE-UPSTREAM-SHA256.txt
          sha256sum sable-companion-1.6.0-652ecf0e-source.zip > SABLE-COMPANION-UPSTREAM-SHA256.txt
          unzip -tq sable-mc1.21.1-2.0.0-neoforge-b7226222-source.zip
          unzip -tq sable-companion-1.6.0-652ecf0e-source.zip

      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragdoll-sable-upstreams
          path: |
            sable-mc1.21.1-2.0.0-neoforge-b7226222-source.zip
            sable-companion-1.6.0-652ecf0e-source.zip
            SABLE-UPSTREAM-COMMIT.txt
            SABLE-COMPANION-UPSTREAM-COMMIT.txt
            SABLE-UPSTREAM-STATUS.txt
            SABLE-COMPANION-UPSTREAM-STATUS.txt
            SABLE-UPSTREAM-SHA256.txt
            SABLE-COMPANION-UPSTREAM-SHA256.txt
          if-no-files-found: error
          retention-days: 14
