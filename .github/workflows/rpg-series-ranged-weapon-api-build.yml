name: RPG Series - Ranged Weapon API Forge 1.20.1

on:
  push:
    branches:
      - workbench/rpg-series-forge-1.20.1
    paths:
      - 'rpg-series-port/ranged-weapon-api-forge-1.20.1/**'
      - '.github/workflows/rpg-series-ranged-weapon-api-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rpg-series-port/ranged-weapon-api-forge-1.20.1/**'
      - '.github/workflows/rpg-series-ranged-weapon-api-build.yml'
  workflow_dispatch:

concurrency:
  group: rpg-series-ranged-weapon-api-active
  cancel-in-progress: true
permissions:
  contents: read
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rpg-series-port/ranged-weapon-api-forge-1.20.1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pending status
        env: { GH_TOKEN: '${{ github.token }}', TARGET_SHA: '${{ github.event.pull_request.head.sha || github.sha }}' }
        run: curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -d '{"state":"pending","context":"rpg-series/ranged-weapon-api-forge-1.20.1","description":"Ranged Weapon API Forge verification is running"}'
      - uses: actions/checkout@v5
        with: { repository: FabricExtras/RangedWeaponAPI, ref: d95ba51c2f5c35bc8d397057092ba6043b00b705, path: _upstream/rwa120 }
      - uses: actions/checkout@v5
        with: { repository: FabricExtras/RangedWeaponAPI, ref: c834f2699faefbdfcefa84f7f45708cd1a6bc55a, path: _upstream/rwa234 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.8', cache-read-only: false }
      - name: Assemble exact source/resources
        run: |
          set -euxo pipefail
          python tools/prepare_upstream_source.py "$GITHUB_WORKSPACE/_upstream/rwa120" "$GITHUB_WORKSPACE/_upstream/rwa234" common
          test ! -f common/src/generatedUpstream/java/net/fabric_extras/ranged_weapon/api/CrossbowMechanics.java
          test ! -f common/src/generatedUpstream/java/net/fabric_extras/ranged_weapon/RangedWeaponMod.java
          test ! -f common/src/generatedUpstream/resources/fabric.mod.json
          test "$(find common/src/generatedUpstream/resources/assets/ranged_weapon/lang -name '*.json' | wc -l)" -ge 20
          if grep -R 'net.fabricmc' common/src/main/java common/src/generatedUpstream/java; then echo 'Fabric loader/API reference leaked into native Forge sources' >&2; exit 1; fi
          rm -f "$GITHUB_WORKSPACE/ranged-weapon-api-forge-1.20.1-source-ci.zip"
          zip -qr "$GITHUB_WORKSPACE/ranged-weapon-api-forge-1.20.1-source-ci.zip" . -x '*/build/*' '*/run/*'
      - name: Build native Forge jar
        run: gradle --no-daemon --stacktrace :forge:build
      - name: Verify package
        run: |
          set -euxo pipefail
          JAR=$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev-shadow*' | head -1)
          test -n "$JAR"; unzip -t "$JAR"
          unzip -p "$JAR" META-INF/mods.toml | grep -F 'modId="ranged_weapon_api"'
          unzip -p "$JAR" META-INF/mods.toml | grep -F 'versionRange="[1.20.1,1.20.2)"'
          unzip -l "$JAR" | grep -F 'net/fabric_extras/ranged_weapon/forge/ForgeMod.class'
          unzip -l "$JAR" | grep -F 'net/fabric_extras/ranged_weapon/api/RangedConfig.class'
          unzip -l "$JAR" | grep -F 'net/fabric_extras/ranged_weapon/api/AttributeModifierIDs.class'
          unzip -l "$JAR" | grep -F 'assets/ranged_weapon/lang/en_us.json'
          if unzip -l "$JAR" | grep -q 'fabric.mod.json\|META-INF/neoforge.mods.toml'; then echo 'Non-Forge metadata leaked into final JAR' >&2; exit 1; fi
          sha256sum "$JAR" | tee ranged-weapon-api-forge.sha256
      - name: Server runtime regression
        run: |
          set -euo pipefail
          rm -rf forge/run/logs; mkdir -p forge/run; printf 'eula=true\n' > forge/run/eula.txt; : > forge-server-smoke.log
          setsid gradle --no-daemon -PrangedWeaponCiSelfTest :forge:runServer > forge-server-smoke.log 2>&1 & PID=$!; DEADLINE=$((SECONDS+180)); PASS=0
          FATAL='MixinApplyError|InvalidMixinException|MixinTransformerError|Failed to start the minecraft server|Failed to create mod instance|NoClassDefFoundError|Registry is already frozen|IllegalStateException: \[Ranged Weapon API CI\]|Exception in server tick loop'
          stop_group(){ kill -TERM -- -"$PID" 2>/dev/null||true; sleep 1; kill -KILL -- -"$PID" 2>/dev/null||true; wait "$PID" 2>/dev/null||true; }
          while ((SECONDS<DEADLINE)); do LOG=$(find forge/run -type f -path '*/logs/latest.log'|head -1||true); FILES=(forge-server-smoke.log); [[ -n "$LOG" ]]&&FILES+=("$LOG"); if grep -Eiq "$FATAL" "${FILES[@]}"; then stop_group; cat "${FILES[@]}"; exit 1; fi; if grep -Fq '[Ranged Weapon API CI] Runtime self-test passed' forge-server-smoke.log && [[ -n "$LOG" ]] && grep -Eq 'Done \([0-9.]+s\)!' "$LOG"; then PASS=1; break; fi; if ! kill -0 "$PID" 2>/dev/null; then wait "$PID"||true; cat "${FILES[@]}"; exit 1; fi; sleep 1; done
          [[ "$PASS" -eq 1 ]] || { stop_group; cat forge-server-smoke.log; exit 1; }; stop_group
      - name: Client resource/model smoke
        run: |
          set -euo pipefail
          rm -rf forge/run/logs; : > forge-client-smoke.log
          setsid xvfb-run -a gradle --no-daemon :forge:runClient > forge-client-smoke.log 2>&1 & PID=$!; DEADLINE=$((SECONDS+180)); READY=0; PASS=0
          FATAL='MixinApplyError|InvalidMixinException|MixinTransformerError|Failed to create mod instance|NoClassDefFoundError.*ranged_weapon|Using missing texture.*ranged_weapon|The game crashed whilst initializing game'
          stop_group(){ kill -TERM -- -"$PID" 2>/dev/null||true; sleep 1; kill -KILL -- -"$PID" 2>/dev/null||true; wait "$PID" 2>/dev/null||true; }
          while ((SECONDS<DEADLINE)); do LOG=$(find forge/run -type f -path '*/logs/latest.log'|head -1||true); FILES=(forge-client-smoke.log); [[ -n "$LOG" ]]&&FILES+=("$LOG"); if grep -Eiq "$FATAL" "${FILES[@]}"; then stop_group; cat "${FILES[@]}"; exit 1; fi; if [[ -n "$LOG" ]]&&grep -Fq 'Reloading ResourceManager' "$LOG"&&grep -Eq 'Backend library: LWJGL|OpenAL initialized' "$LOG"; then [[ "$READY" -eq 0 ]]&&READY=$SECONDS; ((SECONDS-READY>=8))&&{ PASS=1; break; }; fi; if ! kill -0 "$PID" 2>/dev/null; then wait "$PID"||true; cat "${FILES[@]}"; exit 1; fi; sleep 1; done
          [[ "$PASS" -eq 1 ]] || { stop_group; cat forge-client-smoke.log; exit 1; }; stop_group
      - name: Preserve CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranged-weapon-api-forge-1.20.1
          retention-days: 7
          path: |
            ranged-weapon-api-forge-1.20.1-source-ci.zip
            rpg-series-port/ranged-weapon-api-forge-1.20.1/forge/build/libs/*.jar
            rpg-series-port/ranged-weapon-api-forge-1.20.1/ranged-weapon-api-forge.sha256
            rpg-series-port/ranged-weapon-api-forge-1.20.1/forge-server-smoke.log
            rpg-series-port/ranged-weapon-api-forge-1.20.1/forge-client-smoke.log
          if-no-files-found: warn
      - name: Final status
        if: always()
        env: { GH_TOKEN: '${{ github.token }}', JOB_STATUS: '${{ job.status }}', TARGET_SHA: '${{ github.event.pull_request.head.sha || github.sha }}' }
        run: |
          case "$JOB_STATUS" in success) STATE=success;; failure) STATE=failure;; *) STATE=error;; esac
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -d "{\"state\":\"${STATE}\",\"context\":\"rpg-series/ranged-weapon-api-forge-1.20.1\",\"description\":\"Ranged Weapon API Forge CI: ${JOB_STATUS}\"}"
