name: CSS5 Full-System YSM Runner Seal

on:
  push:
    branches:
      - combat-style-suite-5way-qa-20260828
    paths:
      - .github/workflows/css5-fullsystem-ysm-runner-seal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runner:
    runs-on: ubuntu-24.04
    steps:
      - name: Build minimal full-system QA guest and portable QEMU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-system-x86 qemu-utils zstd e2fsprogs

          ROOT=/tmp/css5-rootfs
          sudo debootstrap --variant=minbase noble "$ROOT" http://archive.ubuntu.com/ubuntu
          sudo cp /etc/resolv.conf "$ROOT/etc/resolv.conf"
          sudo chroot "$ROOT" /bin/bash -lc 'set -e; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-17-jre-headless xvfb xauth libgl1-mesa-dri libglx-mesa0 libgl1 libx11-6 libxext6 libxi6 libxrandr2 libxcursor1 libxinerama1 libxrender1 libxxf86vm1 libasound2t64 iproute2 procps kmod linux-image-generic ca-certificates; apt-get clean; rm -rf /var/lib/apt/lists/*'

          sudo mkdir -p "$ROOT/opt/css5" "$ROOT/mnt/host"
          cat > /tmp/css5-init.sh <<'EOS'
          #!/bin/bash
          set -u
          mount -t proc proc /proc || true
          mount -t sysfs sysfs /sys || true
          mount -t devtmpfs devtmpfs /dev || true
          mkdir -p /dev/pts /run /tmp /mnt/host
          mount -t devpts devpts /dev/pts || true
          mount -t tmpfs tmpfs /run || true
          mount -t tmpfs tmpfs /tmp || true
          modprobe 9pnet_virtio || true
          if ! mount -t 9p -o trans=virtio,version=9p2000.L,cache=loose hostshare /mnt/host; then
            echo 'CSS5_GUEST_FAIL hostshare_mount'
            exec bash
          fi
          echo 'CSS5_GUEST_READY'
          exec /mnt/host/run-guest.sh
          EOS
          sudo install -m 0755 /tmp/css5-init.sh "$ROOT/opt/css5/init.sh"

          KERNEL=$(basename "$(readlink -f "$ROOT/vmlinuz")")
          INITRD=$(basename "$(readlink -f "$ROOT/initrd.img")")
          sudo cp "$ROOT/boot/$KERNEL" ./vmlinuz-css5
          sudo cp "$ROOT/boot/$INITRD" ./initrd-css5

          truncate -s 3072M css5-guest.ext4
          mkfs.ext4 -F -q css5-guest.ext4
          mkdir /tmp/css5-mnt
          sudo mount -o loop css5-guest.ext4 /tmp/css5-mnt
          sudo cp -a "$ROOT"/. /tmp/css5-mnt/
          sudo umount /tmp/css5-mnt
          zstd -T0 -15 --sparse -f css5-guest.ext4 -o css5-guest.ext4.zst
          rm css5-guest.ext4

          mkdir -p qemu-portable/bin qemu-portable/lib qemu-portable/share
          cp /usr/bin/qemu-system-x86_64 qemu-portable/bin/
          ldd /usr/bin/qemu-system-x86_64 | awk '/=> \/|^\//{for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}' | sort -u | while read -r lib; do cp -L "$lib" qemu-portable/lib/; done
          cp -a /usr/share/qemu qemu-portable/share/
          if [ -d /usr/share/seabios ]; then cp -a /usr/share/seabios qemu-portable/share/; fi
          tar -C qemu-portable -cf - . | zstd -T0 -15 -o qemu-portable.tar.zst
          sha256sum vmlinuz-css5 initrd-css5 css5-guest.ext4.zst qemu-portable.tar.zst | tee SHA256SUMS.txt
          qemu-system-x86_64 --version | tee QEMU-VERSION.txt
          printf 'Ubuntu 24.04 noble minimal guest; full-system TCG only; no YSM modification.\n' > PROVENANCE.txt

      - name: Upload runner core
        uses: actions/upload-artifact@v4
        with:
          name: css5-fullsystem-ysm-runner-core
          path: |
            vmlinuz-css5
            initrd-css5
            qemu-portable.tar.zst
            SHA256SUMS.txt
            QEMU-VERSION.txt
            PROVENANCE.txt
          retention-days: 3
          if-no-files-found: error

      - name: Split and upload guest image
        shell: bash
        run: |
          set -euo pipefail
          split -b 300M -d -a 2 css5-guest.ext4.zst css5-guest.ext4.zst.part-
          sha256sum css5-guest.ext4.zst css5-guest.ext4.zst.part-* > GUEST-SHA256SUMS.txt

      - name: Upload guest part 00
        uses: actions/upload-artifact@v4
        with:
          name: css5-fullsystem-ysm-guest-part-00
          path: css5-guest.ext4.zst.part-00
          retention-days: 3
          if-no-files-found: error

      - name: Upload guest part 01
        uses: actions/upload-artifact@v4
        with:
          name: css5-fullsystem-ysm-guest-part-01
          path: css5-guest.ext4.zst.part-01
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload guest manifest
        uses: actions/upload-artifact@v4
        with:
          name: css5-fullsystem-ysm-guest-manifest
          path: GUEST-SHA256SUMS.txt
          retention-days: 3
          if-no-files-found: error
