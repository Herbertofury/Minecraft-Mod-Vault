name: Backpacks QA Platform Fetch

on:
  push:
    branches:
      - backpacks-qa-platform-fetch-20260907

permissions:
  contents: read

jobs:
  fetch-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Platform 1.3.4 Forge runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 2 \
            'https://cdn.modrinth.com/data/i6fiqm5y/versions/aWxR0Ksa/Platform-forge-1.20.1-1.3.4.jar' \
            -o out/Platform-forge-1.20.1-1.3.4.jar
          test -s out/Platform-forge-1.20.1-1.3.4.jar
          unzip -t out/Platform-forge-1.20.1-1.3.4.jar
          unzip -p out/Platform-forge-1.20.1-1.3.4.jar META-INF/mods.toml | tee out/platform-mods.toml
          grep -q 'modId="platform"' out/platform-mods.toml
          grep -q 'version="1.3.4"' out/platform-mods.toml
          sha256sum out/Platform-forge-1.20.1-1.3.4.jar | tee out/SHA256SUMS.txt
      - name: Upload exact runtime
        uses: actions/upload-artifact@v4
        with:
          name: platform-forge-1.20.1-1.3.4
          path: out/
          if-no-files-found: error
          retention-days: 1
