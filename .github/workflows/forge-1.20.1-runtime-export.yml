name: Forge 1.20.1 Runtime Export

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ragdoll-runtime/**'
      - '.github/workflows/forge-1.20.1-runtime-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charmsy-production-client-runtime:
    if: startsWith(github.head_ref, 'ragdoll-runtime-export') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install launcher helper
        run: python -m pip install --disable-pip-version-check minecraft-launcher-lib
      - name: Build exact Forge 47.4.23 production client runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, shutil
          import minecraft_launcher_lib

          root = pathlib.Path('/tmp/charmsy-production-client')
          export = pathlib.Path('/tmp/charmsy-production-export')
          root.mkdir(parents=True, exist_ok=True)
          export.mkdir(parents=True, exist_ok=True)

          minecraft_launcher_lib.install.install_minecraft_version('1.20.1', str(root))
          minecraft_launcher_lib.forge.install_forge_version('1.20.1-47.4.23', str(root))

          installed = minecraft_launcher_lib.utils.get_installed_versions(str(root))
          forge_ids = [entry['id'] for entry in installed if '47.4.23' in entry['id'] and '1.20.1' in entry['id']]
          if not forge_ids:
              raise RuntimeError(f'Forge 47.4.23 not found after install: {installed!r}')
          forge_id = sorted(forge_ids)[-1]

          game_dir = root / 'game'
          game_dir.mkdir(parents=True, exist_ok=True)
          options = {
              'username': 'CharmsyQA',
              'uuid': '00000000000000000000000000000001',
              'token': '0',
              'launcherName': 'MinecraftDevKit',
              'launcherVersion': '1',
              'gameDirectory': str(game_dir),
              'jvmArguments': ['-Xms1G', '-Xmx4G'],
              'customResolution': True,
              'resolutionWidth': '1280',
              'resolutionHeight': '720',
          }
          command = minecraft_launcher_lib.command.get_minecraft_command(forge_id, str(root), options)
          template = [str(token).replace(str(root), '__MCDIR__') for token in command]

          (export / 'launch-command-template.json').write_text(json.dumps(template, indent=2) + '\n')
          (export / 'installed-versions.json').write_text(json.dumps(installed, indent=2) + '\n')
          (export / 'runtime-info.json').write_text(json.dumps({
              'minecraft': '1.20.1',
              'forge': '47.4.23',
              'forge_version_id': forge_id,
              'minecraft_launcher_lib_version': getattr(minecraft_launcher_lib, '__version__', None),
              'source_root': str(root),
              'assets_exported': False,
          }, indent=2) + '\n')

          for name in ('libraries', 'versions'):
              source = root / name
              if not source.is_dir():
                  raise RuntimeError(f'missing installed runtime directory: {source}')
              shutil.copytree(source, export / name)

          # Native extraction directories are command-dependent and may live outside
          # libraries/versions. Preserve every existing command path under root that
          # is a directory and is not the omitted assets/game tree.
          copied_dirs = []
          for token in command:
              text = str(token)
              candidates = []
              if text.startswith('-D') and '=' in text:
                  candidates.extend(text.split('=', 1)[1].split(os.pathsep))
              else:
                  candidates.extend(text.split(os.pathsep))
              for candidate in candidates:
                  if not candidate.startswith(str(root)):
                      continue
                  path = pathlib.Path(candidate)
                  try:
                      rel = path.relative_to(root)
                  except ValueError:
                      continue
                  if not path.is_dir() or not path.exists():
                      continue
                  if not rel.parts or rel.parts[0] in {'assets', 'game', 'libraries', 'versions'}:
                      continue
                  dest = export / rel
                  if dest.exists():
                      continue
                  shutil.copytree(path, dest)
                  copied_dirs.append(str(rel))
          (export / 'extra-runtime-dirs.json').write_text(json.dumps(sorted(copied_dirs), indent=2) + '\n')
          PY

          cd /tmp/charmsy-production-export
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          test -s launch-command-template.json
          test -d libraries
          test -d versions
          du -sh .
          sed -n '1,120p' runtime-info.json
          sed -n '1,160p' launch-command-template.json

      - uses: actions/upload-artifact@v4
        with:
          name: charmsy-production-forge-1.20.1-47.4.23-client
          path: /tmp/charmsy-production-export
          if-no-files-found: error
          retention-days: 3

  charmsy-runtime-deps:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Export exact dependency versions from the verified Charmsy native stack
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/charmsy-runtime-deps
          mkdir -p "$root/metadata"
          cd "$root"

          fetch_mod() {
            local artifact="$1" project="$2" file_id="$3" output="$4" mod_id="$5"
            local url="https://cursemaven.com/curse/maven/${artifact}-${project}/${file_id}/${artifact}-${project}-${file_id}.jar"
            curl -fL --retry 4 --retry-delay 2 -o "$output" "$url"
            unzip -tqq "$output"
            mkdir -p "metadata/${output%.jar}"
            unzip -p "$output" META-INF/mods.toml > "metadata/${output%.jar}/mods.toml" 2>/dev/null || true
            unzip -p "$output" META-INF/neoforge.mods.toml > "metadata/${output%.jar}/neoforge.mods.toml" 2>/dev/null || true
            unzip -p "$output" META-INF/MANIFEST.MF > "metadata/${output%.jar}/MANIFEST.MF" 2>/dev/null || true
            if [ -s "metadata/${output%.jar}/mods.toml" ]; then
              grep -Eiq "modId[[:space:]]*=[[:space:]]*\"${mod_id}\"" "metadata/${output%.jar}/mods.toml"
            fi
            printf '%s\t%s\t%s\t%s\n' "$output" "$project" "$file_id" "$url" >> PROVENANCE.tsv
          }

          fetch_mod architectury-api 419699 5137938 architectury-9.2.14-forge.jar architectury
          fetch_mod cloth-config 348521 5729105 cloth-config-11.1.136-forge.jar cloth_config
          fetch_mod fzzy-config 1005914 7568893 'fzzy_config-0.7.6+1.20.1+forge.jar' fzzy_config
          fetch_mod playeranimator 658587 4587214 'player-animation-lib-forge-1.0.2-rc1+1.20.jar' playeranimator
          fetch_mod simply-tooltips 1475755 8715158 'SimplyTooltips-forge-0.1.5-1.20.1.jar' simplytooltips
          fetch_mod kotlin-for-forge 351264 7291067 kffmod-4.12.0.jar kotlinforforge

          sha256sum *.jar > SHA256SUMS.txt
          sha1sum *.jar > SHA1SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: charmsy-verified-runtime-dependencies
          path: /tmp/charmsy-runtime-deps
          if-no-files-found: error
          retention-days: 3

  charmsy-root-mods:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Export pinned Charmsy runtime root mods
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/charmsy-root-mods
          mkdir -p "$root/metadata"
          cd "$root"

          curl -fL --retry 4 --retry-delay 2 -o punchy.jar \
            'https://cursemaven.com/curse/maven/punchy-1374153/8697202/punchy-1374153-8697202.jar'
          printf '%s  %s\n' \
            '180347c82d6b738cdb8bc5aef2f84f1a34781d20e3aea03a28f3ad84ff82ec76' \
            'punchy.jar' | sha256sum -c -

          curl -fL --retry 4 --retry-delay 2 -o bettercombat.jar \
            'https://cursemaven.com/curse/maven/better-combat-by-daedelus-639842/7287334/better-combat-by-daedelus-639842-7287334.jar'
          printf '%s  %s\n' \
            '49c69dccf2c641246b4e3deca81ebac21f0ee119e81fc713b838b8e33569eea1' \
            'bettercombat.jar' | sha256sum -c -

          curl -fL --retry 4 --retry-delay 2 -o simplyswords.jar \
            'https://cursemaven.com/curse/maven/simply-swords-659887/8746028/simply-swords-659887-8746028.jar'
          unzip -tqq simplyswords.jar
          unzip -p simplyswords.jar META-INF/mods.toml > simplyswords-mods.toml
          grep -Eiq 'modId[[:space:]]*=[[:space:]]*"simplyswords"' simplyswords-mods.toml
          printf '%s  %s\n' \
            '642e385ffda914f1b9411f0a457fe5fb5e05aa160dc44392dec9a549c2bcec21' \
            'simplyswords.jar' | sha256sum -c -

          mv punchy.jar punchy-2.7d-forge-1.20.1.jar
          mv bettercombat.jar 'bettercombat-forge-1.9.0+1.20.1.jar'
          mv simplyswords.jar simplyswords-forge-neoforge-1.70.2-1.20.1.jar

          for jar in *.jar; do
            stem="${jar%.jar}"
            mkdir -p "metadata/$stem"
            unzip -p "$jar" META-INF/mods.toml > "metadata/$stem/mods.toml" 2>/dev/null || true
            unzip -p "$jar" META-INF/neoforge.mods.toml > "metadata/$stem/neoforge.mods.toml" 2>/dev/null || true
            unzip -p "$jar" META-INF/MANIFEST.MF > "metadata/$stem/MANIFEST.MF" 2>/dev/null || true
          done
          mv simplyswords-mods.toml metadata/simplyswords-provider-mods.toml

          sha256sum *.jar > SHA256SUMS.txt
          sha1sum *.jar > SHA1SUMS.txt
          printf '%s\n' \
            'Punchy: CurseForge project 1374153 file 8697202' \
            'Better Combat: CurseForge project 639842 file 7287334' \
            'Simply Swords: CurseForge project 659887 file 8746028' \
            > PROVENANCE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: charmsy-pinned-runtime-root-mods
          path: /tmp/charmsy-root-mods
          if-no-files-found: error
          retention-days: 3

  forge-runtime:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Forge 47.4.23 dedicated server runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/forge-server
          cd /tmp/forge-server
          curl -fL --retry 4 --retry-delay 2 -o forge-installer.jar 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar'
          java -jar forge-installer.jar --installServer
          rm -f forge-installer.jar forge-installer.jar.log
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nlevel-name=world\nview-distance=4\nsimulation-distance=4\nmax-tick-time=-1\n' > server.properties
          mkdir -p mods
          sha256sum run.sh user_jvm_args.txt > runtime-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: forge-1.20.1-47.4.23-runtime
          path: /tmp/forge-server
          if-no-files-found: error
          retention-days: 3
