name: Forge 1.20.1 Runtime Export

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/forge-1.20.1-runtime-export.yml'

permissions:
  contents: read

jobs:
  charmsy-production-client-runtime:
    if: startsWith(github.head_ref, 'ragdoll-runtime-export')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install launcher helper
        run: python -m pip install --disable-pip-version-check 'minecraft-launcher-lib==8.0'

      - name: Build exact Forge 47.4.23 production client runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/charmsy-production-client"
          EXPORT="$RUNNER_TEMP/charmsy-production-export"
          mkdir -p "$ROOT" "$EXPORT"
          export ROOT EXPORT

          python - <<'PY'
          import json, os
          from pathlib import Path
          import minecraft_launcher_lib

          root = Path(os.environ['ROOT'])
          minecraft_launcher_lib.install.install_minecraft_version('1.20.1', str(root))

          profiles = root / 'launcher_profiles.json'
          if not profiles.exists():
              profiles.write_text(json.dumps({
                  'profiles': {},
                  'settings': {},
                  'version': 3,
              }, indent=2) + '\n')
          PY

          curl -fL --retry 4 --retry-delay 2 \
            -o "$RUNNER_TEMP/forge-installer.jar" \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar'
          java -jar "$RUNNER_TEMP/forge-installer.jar" --installClient "$ROOT"

          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          import minecraft_launcher_lib

          root = Path(os.environ['ROOT']).resolve()
          export = Path(os.environ['EXPORT']).resolve()
          forge_id = '1.20.1-forge-47.4.23'
          version_json = root / 'versions' / forge_id / f'{forge_id}.json'
          if not version_json.is_file():
              installed = minecraft_launcher_lib.utils.get_installed_versions(str(root))
              raise RuntimeError(f'Forge version JSON missing: {version_json}; installed={installed!r}')

          game_dir = root / 'game'
          game_dir.mkdir(parents=True, exist_ok=True)
          options = {
              'username': 'CharmsyQA',
              'uuid': '00000000000000000000000000000001',
              'token': '0',
              'launcherName': 'MinecraftDevKit',
              'launcherVersion': '1',
              'gameDirectory': str(game_dir),
              'jvmArguments': ['-Xms1G', '-Xmx4G'],
              'customResolution': True,
              'resolutionWidth': '1280',
              'resolutionHeight': '720',
              'executablePath': 'java',
          }
          command = minecraft_launcher_lib.command.get_minecraft_command(
              forge_id, str(root), options
          )
          template = [str(token).replace(str(root), '__MCDIR__') for token in command]

          (export / 'launch-command-template.json').write_text(
              json.dumps({
                  'minecraft': '1.20.1',
                  'forge': '47.4.23',
                  'forge_version_id': forge_id,
                  'command': template,
              }, indent=2) + '\n'
          )

          for name in ('libraries', 'versions'):
              source = root / name
              if not source.is_dir():
                  raise RuntimeError(f'missing runtime directory: {source}')
              shutil.copytree(source, export / name)

          checksums = []
          for file in sorted(export.rglob('*')):
              if file.is_file() and file.name != 'SHA256SUMS.txt':
                  digest = hashlib.sha256(file.read_bytes()).hexdigest()
                  checksums.append(f'{digest}  {file.relative_to(export).as_posix()}')
          (export / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n')

          print(json.dumps({
              'forge_version_json': str(version_json),
              'command_tokens': len(template),
              'runtime_files': len(checksums),
          }, indent=2))
          PY

          test -s "$EXPORT/launch-command-template.json"
          test -d "$EXPORT/libraries"
          test -d "$EXPORT/versions/1.20.1-forge-47.4.23"
          du -sh "$EXPORT"

      - name: Upload production client artifact
        uses: actions/upload-artifact@v4
        with:
          name: charmsy-production-forge-1.20.1-47.4.23-client
          path: ${{ runner.temp }}/charmsy-production-export
          if-no-files-found: error
          retention-days: 3

      - name: Upload installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: charmsy-production-client-failure-diagnostics
          path: |
            ${{ runner.temp }}/charmsy-production-client/installer.log
            ${{ runner.temp }}/forge-installer.jar.log
          if-no-files-found: ignore
          retention-days: 1
