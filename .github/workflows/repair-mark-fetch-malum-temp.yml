name: Repair Mark - Fetch Malum Official Art

on:
  push:
    branches:
      - repair-mark-fetch
    paths:
      - .github/workflows/repair-mark-fetch-malum-temp.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact official Malum 1.20.1 artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-all-errors \
            'https://raw.githubusercontent.com/SammySemicolon/Malum-Mod/1.20.1/src/main/resources/malum.png' \
            -o out/malum-official-1.20.1.png
          test "$(git hash-object out/malum-official-1.20.1.png)" = '3c4b86cee6e6b4fb4ee11692bada0696d2e720ef'
          file out/malum-official-1.20.1.png
          sha256sum out/malum-official-1.20.1.png > out/SHA256SUMS.txt
      - name: Upload exact official artwork
        uses: actions/upload-artifact@v4
        with:
          name: repair-mark-malum-official-art
          path: out/
          if-no-files-found: error
          retention-days: 1
