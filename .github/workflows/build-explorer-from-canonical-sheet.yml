name: Build Explorer From Canonical Sheet

on:
  push:
    paths:
      - '.github/workflows/build-explorer-from-canonical-sheet.yml'
      - '.github/mrv-explorer-staging/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Recover exact verified staging, Explorer, and reusable builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, itertools, json, lzma, subprocess

          root = Path('.')
          stage_dir = root / '.github/mrv-explorer-staging'
          staged = [stage_dir / f'xzstage-{i:02d}.b64' for i in range(7)]
          expected_lengths = [16000, 16000, 16000, 16000, 16000, 16000, 8556]
          expected_b64_sha = '271ea724416e17f58f88cff8d1efd952d6b8a0c901523b31b9d42ec342387a7d'
          expected_packed_sha = '66b0f23524071505c6bb91787e3e60f50b5fcc522cdd2b31cb024ec73c8cfeee'
          expected_html_sha = 'b54231180dd98b8a2182836391e3ef9609af320d37e244246c55539f5078853e'

          def normalize(text):
              return ''.join(text.split())

          def historical_candidates(path, expected_len):
              candidates = []
              seen = set()

              def add(text, source):
                  value = normalize(text)
                  variants = [(value, source)]
                  # Known prior staging-write defect: a literal "g==" suffix was appended.
                  if len(value) == expected_len + 3 and value.endswith('g=='):
                      variants.append((value[:-3], source + ':trim-known-g=='))
                  for candidate, label in variants:
                      if len(candidate) != expected_len or candidate in seen:
                          continue
                      seen.add(candidate)
                      candidates.append((candidate, label))

              if path.is_file():
                  add(path.read_text(), 'working-tree')

              commits = subprocess.check_output(
                  ['git', 'log', '--all', '--format=%H', '--', path.as_posix()],
                  text=True,
              ).splitlines()
              for commit in commits:
                  try:
                      text = subprocess.check_output(
                          ['git', 'show', f'{commit}:{path.as_posix()}'],
                          text=True,
                          stderr=subprocess.DEVNULL,
                      )
                  except subprocess.CalledProcessError:
                      continue
                  add(text, commit)
              return candidates

          candidate_sets = []
          for path, expected_len in zip(staged, expected_lengths):
              candidates = historical_candidates(path, expected_len)
              if not candidates:
                  raise SystemExit(f'no length-valid historical candidates for {path}')
              print(path, 'candidate_count=', len(candidates))
              for value, source in candidates:
                  print(' ', source, hashlib.sha256(value.encode('ascii')).hexdigest())
              candidate_sets.append(candidates)

          # Search the small historical candidate space using incremental SHA copies.
          states = [(hashlib.sha256(), [], [])]
          for index, candidates in enumerate(candidate_sets):
              next_states = []
              for digest, values, sources in states:
                  for value, source in candidates:
                      d = digest.copy()
                      d.update(value.encode('ascii'))
                      next_states.append((d, values + [value], sources + [source]))
              states = next_states
              print('candidate combinations after part', index, '=', len(states))
              if len(states) > 500000:
                  raise SystemExit('historical staging candidate space unexpectedly large; refusing unsafe combinatorial recovery')

          match = None
          for digest, values, sources in states:
              if digest.hexdigest() == expected_b64_sha:
                  match = (values, sources)
                  break
          if match is None:
              actual = ''.join(normalize(p.read_text()) for p in staged if p.is_file())
              print('current concatenated sha256=', hashlib.sha256(actual.encode('ascii')).hexdigest() if actual else 'missing')
              raise SystemExit('no historical staging combination matches the verified canonical base64 SHA-256')

          parts, sources = match
          print('matched verified staging sources:', json.dumps(sources))
          for path, value in zip(staged, parts):
              path.write_text(value, encoding='ascii')

          b64 = ''.join(parts)
          b64_sha = hashlib.sha256(b64.encode('ascii')).hexdigest()
          if b64_sha != expected_b64_sha:
              raise SystemExit('internal staging recovery hash mismatch')

          packed = base64.b64decode(b64, validate=True)
          packed_sha = hashlib.sha256(packed).hexdigest()
          if len(packed) != 78416 or packed_sha != expected_packed_sha:
              raise SystemExit(f'Explorer xz identity mismatch: bytes={len(packed)} sha256={packed_sha}')

          html_bytes = lzma.decompress(packed)
          actual_sha = hashlib.sha256(html_bytes).hexdigest()
          if len(html_bytes) != 374830 or actual_sha != expected_html_sha:
              raise SystemExit(f'Explorer identity mismatch: bytes={len(html_bytes)} sha256={actual_sha}')
          text = html_bytes.decode('utf-8')
          for marker in ('no row caps, viewport culling', 'window.__EXPLORER_TEST__'):
              if marker not in text:
                  raise SystemExit(f'missing Explorer contract marker: {marker}')
          Path('Minecraft Recommendations Vault - Explorer.html').write_bytes(html_bytes)

          builder_b64 = normalize((stage_dir / 'builder.py.xz.b64').read_text())
          builder = lzma.decompress(base64.b64decode(builder_b64, validate=True))
          builder_sha = hashlib.sha256(builder).hexdigest()
          if len(builder) != 23550 or builder_sha != 'e59e7dfd0eb01271c021fd99a962ea490f1bff6b9290aac968a81142de955d5b':
              raise SystemExit(f'builder identity mismatch: bytes={len(builder)} sha256={builder_sha}')
          tool_dir = Path('tools/recommendations-explorer')
          tool_dir.mkdir(parents=True, exist_ok=True)
          (tool_dir / 'build_recommendations_explorer.py').write_bytes(builder)
          (tool_dir / 'README.md').write_text(
              '# Recommendations Vault Explorer builder\n\n'
              '`build_recommendations_explorer.py` regenerates the single-file Explorer from an `.xlsx` export of the canonical Google Sheet '
              '`Minecraft Recommendations Vault — Master Tracker`, emits provenance, and uses no dataset caps or viewport culling.\n',
              encoding='utf-8'
          )

          meta = {
              'artifact': 'Minecraft Recommendations Vault - Explorer.html',
              'artifactBytes': len(html_bytes),
              'artifactSha256': actual_sha,
              'sourceWorkbook': 'Minecraft Recommendations Vault — Master Tracker',
              'sourceWorkbookBytes': 208302,
              'sourceWorkbookSha256': '1884992039376376d721b552c74f7301d8603adad616190446c5eb5223392961',
              'sourceDriveId': '1N5rGN1E6jk3LMcPLNoRVWi3-8QmFtOikBguvoCaAMMg',
              'sourceModifiedTime': '2026-08-29T22:28:18.260Z',
              'generatorVersion': 'recommendations-explorer/1.0.0',
              'generatorBytes': len(builder),
              'generatorSha256': builder_sha,
              'sheetCount': 14,
              'sourceRowCount': 587,
              'masterItemCount': 186,
              'publicationRecovery': {
                  'mode': 'verified-git-history-staging-reconstruction',
                  'stagedBase64Sha256': b64_sha,
                  'stagedXzSha256': packed_sha,
                  'selectedSources': sources,
                  'reason': 'The canonical Drive Sheet is private to authenticated Drive access. Git history contained the exact verified staged chunks, so the workflow reconstructed the canonical stream fail-closed by its known SHA-256, then verified compressed and decompressed identities before publication.'
              }
          }
          Path('Minecraft Recommendations Vault - Explorer.build.json').write_text(
              json.dumps(meta, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print(json.dumps(meta, sort_keys=True))
          PY

      - name: Publish repaired staging and rebuilt canonical Explorer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/mrv-explorer-staging/xzstage-*.b64 \
                  'Minecraft Recommendations Vault - Explorer.html' \
                  'Minecraft Recommendations Vault - Explorer.build.json' \
                  'tools/recommendations-explorer/build_recommendations_explorer.py' \
                  'tools/recommendations-explorer/README.md'
          if git diff --cached --quiet; then
            echo 'Canonical Explorer and staging already match the verified recovered bytes.'
            exit 0
          fi
          git commit -m 'Publish verified Minecraft Recommendations Vault Explorer'
          git push
