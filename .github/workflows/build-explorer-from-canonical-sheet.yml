name: Build Explorer From Canonical Sheet

on:
  push:
    paths:
      - '.github/workflows/build-explorer-from-canonical-sheet.yml'
      - '.github/mrv-explorer-staging/builder.py.xz.b64'
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

concurrency:
  group: minecraft-recommendations-vault-explorer-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Regenerate Explorer from canonical Google Sheet
        id: regenerate
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > explorer-recovery.log 2>&1
          from pathlib import Path
          import base64
          import hashlib
          import json
          import lzma
          import subprocess
          import sys
          import urllib.request
          import zipfile
          import xml.etree.ElementTree as ET

          root = Path('.')
          stage_dir = root / '.github/mrv-explorer-staging'
          out = root / 'Minecraft Recommendations Vault - Explorer.html'
          builder_path = root / 'tools/recommendations-explorer/build_recommendations_explorer.py'
          source_id = '1N5rGN1E6jk3LMcPLNoRVWi3-8QmFtOikBguvoCaAMMg'
          source_url = f'https://docs.google.com/spreadsheets/d/{source_id}/export?format=xlsx'
          workbook_path = Path('/tmp/Minecraft-Recommendations-Vault-current.xlsx')

          def normalize(text):
              return ''.join(text.split())

          request = urllib.request.Request(source_url, headers={'User-Agent': 'Mozilla/5.0 GitHub-Actions-Explorer-Sync/1.0'})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  workbook = response.read()
                  print('SOURCE_HTTP_STATUS', response.status)
                  print('SOURCE_CONTENT_TYPE', response.headers.get('Content-Type'))
                  print('SOURCE_FINAL_URL', response.geturl())
          except Exception as exc:
              raise SystemExit(f'canonical Google Sheet export request failed: {exc!r}')

          workbook_path.write_bytes(workbook)
          workbook_sha = hashlib.sha256(workbook).hexdigest()
          print('SOURCE_BYTES', len(workbook))
          print('SOURCE_SHA256', workbook_sha)
          if not zipfile.is_zipfile(workbook_path):
              prefix = workbook[:500].decode('utf-8', errors='replace')
              raise SystemExit('canonical Google Sheet export is not XLSX; response prefix=' + repr(prefix))

          with zipfile.ZipFile(workbook_path) as zf:
              names = set(zf.namelist())
              required = {'xl/workbook.xml', '[Content_Types].xml'}
              if not required.issubset(names):
                  raise SystemExit('canonical workbook is missing required XLSX structures')
              wb_root = ET.fromstring(zf.read('xl/workbook.xml'))
              ns = {'x': 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
              sheets = wb_root.findall('.//x:sheets/x:sheet', ns)
              sheet_names = [s.attrib['name'] for s in sheets]
              print('SOURCE_SHEETS', json.dumps(sheet_names, ensure_ascii=False))
              if len(sheets) != 14:
                  raise SystemExit(f'canonical workbook sheet count mismatch: {len(sheets)} != 14')
              required_sheet_names = {
                  'Dashboard','Category Leaders','Master Catalog','Monster Girls','Animated Packs','CIT Packs',
                  'Client-Safe','Change Log','Sources & Rules','3D Packs','Launchers & Managers','World Tools',
                  'Conversion Stack','Mod Conversion Stack'
              }
              if set(sheet_names) != required_sheet_names:
                  raise SystemExit('canonical workbook sheet-name set mismatch')

          builder_b64_path = stage_dir / 'builder.py.xz.b64'
          if not builder_b64_path.is_file():
              raise SystemExit('missing reproducible Explorer builder staging payload')
          try:
              builder = lzma.decompress(base64.b64decode(normalize(builder_b64_path.read_text(encoding='ascii')), validate=True))
          except Exception as exc:
              raise SystemExit(f'Explorer builder staging payload is corrupt: {exc!r}')
          builder_sha = hashlib.sha256(builder).hexdigest()
          expected_builder_sha = 'e59e7dfd0eb01271c021fd99a962ea490f1bff6b9290aac968a81142de955d5b'
          if len(builder) != 23550 or builder_sha != expected_builder_sha:
              raise SystemExit(f'Explorer builder identity mismatch: bytes={len(builder)} sha256={builder_sha}')
          builder_path.parent.mkdir(parents=True, exist_ok=True)
          builder_path.write_bytes(builder)
          (builder_path.parent / 'README.md').write_text(
              '# Recommendations Vault Explorer builder\n\n'
              '`build_recommendations_explorer.py` regenerates the single-file Explorer from an `.xlsx` export of the canonical Google Sheet '
              '`Minecraft Recommendations Vault — Master Tracker`, emits source provenance, and preserves the full dataset with no row caps or viewport culling.\n',
              encoding='utf-8',
          )

          help_run = subprocess.run([sys.executable, str(builder_path), '--help'], text=True, capture_output=True, timeout=30)
          print('BUILDER_HELP_RETURN', help_run.returncode)
          print('BUILDER_HELP_STDOUT', help_run.stdout[-6000:])
          print('BUILDER_HELP_STDERR', help_run.stderr[-3000:])

          attempts = [
              [sys.executable, str(builder_path), str(workbook_path), '--output', str(out)],
              [sys.executable, str(builder_path), '--input', str(workbook_path), '--output', str(out)],
              [sys.executable, str(builder_path), '--workbook', str(workbook_path), '--output', str(out)],
              [sys.executable, str(builder_path), '--source', str(workbook_path), '--output', str(out)],
              [sys.executable, str(builder_path), str(workbook_path), str(out)],
              [sys.executable, str(builder_path), str(workbook_path)],
          ]
          produced = False
          failures = []
          for argv in attempts:
              if out.exists():
                  out.unlink()
              try:
                  run = subprocess.run(argv, text=True, capture_output=True, timeout=180)
              except Exception as exc:
                  failures.append({'argv': argv, 'error': repr(exc)})
                  continue
              print('BUILDER_ATTEMPT', json.dumps({'argv': argv, 'returncode': run.returncode, 'stdout': run.stdout[-3000:], 'stderr': run.stderr[-3000:]}))
              if out.exists() and out.stat().st_size > 100000:
                  produced = True
                  break
              failures.append({'argv': argv, 'returncode': run.returncode, 'stdout': run.stdout[-1000:], 'stderr': run.stderr[-1000:]})

          if not produced:
              raise SystemExit('Explorer builder did not produce an acceptable output candidate: ' + json.dumps(failures[-3:]))

          html = out.read_bytes()
          html_sha = hashlib.sha256(html).hexdigest()
          text = html.decode('utf-8')
          required_markers = (
              'no row caps, viewport culling',
              'window.__EXPLORER_TEST__',
              'Minecraft Recommendations Vault',
          )
          missing = [m for m in required_markers if m not in text]
          if missing:
              raise SystemExit(f'generated Explorer is missing acceptance markers: {missing}')
          if len(html) < 350000:
              raise SystemExit(f'generated Explorer is unexpectedly small: {len(html)} bytes')

          metadata = {
              'artifact': out.name,
              'artifactBytes': len(html),
              'artifactSha256': html_sha,
              'sourceWorkbook': 'Minecraft Recommendations Vault — Master Tracker',
              'sourceDriveId': source_id,
              'sourceModifiedTime': '2026-08-29T22:28:18.260Z',
              'sourceWorkbookBytes': len(workbook),
              'sourceWorkbookSha256': workbook_sha,
              'generatorVersion': 'recommendations-explorer/1.0.0',
              'generatorBytes': len(builder),
              'generatorSha256': builder_sha,
              'sheetCount': 14,
              'acceptance': {
                  'minimumBytes': 350000,
                  'markers': list(required_markers),
                  'noDatasetCaps': True,
                  'noViewportCulling': True,
              },
              'publicationRecovery': {
                  'mode': 'source-first-public-google-sheet-export',
                  'verification': 'valid XLSX + exact sheet set + reusable builder identity + generated HTML size/markers/SHA-256',
              },
          }
          Path('Minecraft Recommendations Vault - Explorer.build.json').write_text(
              json.dumps(metadata, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print('EXPLORER_ACCEPTED', json.dumps(metadata, sort_keys=True))
          PY
          status=$?
          cat explorer-recovery.log
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Explorer recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-recovery-diagnostics
          path: explorer-recovery.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated Explorer for remote round-trip
        if: steps.regenerate.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-recommendations-vault-explorer
          path: |
            Minecraft Recommendations Vault - Explorer.html
            Minecraft Recommendations Vault - Explorer.build.json
          if-no-files-found: error
          retention-days: 30

      - name: Require regeneration success
        if: steps.regenerate.outputs.exit_code != '0'
        shell: bash
        run: |
          echo 'Explorer regeneration failed; diagnostics were uploaded for deterministic repair.' >&2
          exit 1

      - name: Publish regenerated Explorer and reusable builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Minecraft Recommendations Vault - Explorer.html' \
                  'Minecraft Recommendations Vault - Explorer.build.json' \
                  'tools/recommendations-explorer/build_recommendations_explorer.py' \
                  'tools/recommendations-explorer/README.md'
          if git diff --cached --quiet; then
            echo 'GitHub already contains the current verified Explorer build.'
            exit 0
          fi
          git commit -m 'Publish current verified Minecraft Recommendations Vault Explorer'
          git push
