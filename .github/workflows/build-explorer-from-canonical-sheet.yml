name: Build Explorer From Canonical Sheet

on:
  push:
    paths:
      - '.github/workflows/build-explorer-from-canonical-sheet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Recover exact Explorer from verified Git history
        id: recover
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > explorer-recovery.log 2>&1
          from pathlib import Path
          import base64
          import hashlib
          import itertools
          import json
          import lzma
          import subprocess

          stage_dir = Path('.github/mrv-explorer-staging')
          stage_paths = [stage_dir / f'xzstage-{i:02d}.b64' for i in range(7)]
          expected_lengths = [16000, 16000, 16000, 16000, 16000, 16000, 8600]
          expected_html_bytes = 374830
          expected_html_sha = '5121cc0ec5ab44a225fe7bfc6cfd2734ff2cce26e8173e2f4758e0f1183a8fd7'
          expected_builder_sha = 'e59e7dfd0eb01271c021fd99a962ea490f1bff6b9290aac968a81142de955d5b'

          def normalize(text):
              return ''.join(text.split())

          def historical_candidates(path, expected_len):
              candidates = []
              seen = set()

              def add(text, source):
                  value = normalize(text)
                  variants = [(value, source)]
                  if len(value) == expected_len + 3 and value.endswith('g=='):
                      variants.append((value[:-3], source + ':trim-known-g=='))
                  for candidate, label in variants:
                      if len(candidate) != expected_len or candidate in seen:
                          continue
                      seen.add(candidate)
                      candidates.append((candidate, label))

              if path.is_file():
                  add(path.read_text(encoding='ascii'), 'working-tree')
              commits = subprocess.check_output(
                  ['git', 'log', '--all', '--format=%H', '--', path.as_posix()], text=True
              ).splitlines()
              for commit in commits:
                  try:
                      text = subprocess.check_output(
                          ['git', 'show', f'{commit}:{path.as_posix()}'],
                          text=True,
                          stderr=subprocess.DEVNULL,
                      )
                  except subprocess.CalledProcessError:
                      continue
                  add(text, commit)
              return candidates

          candidate_sets = []
          for path, expected_len in zip(stage_paths, expected_lengths):
              candidates = historical_candidates(path, expected_len)
              if not candidates:
                  raise SystemExit(f'no length-valid historical candidates for {path}')
              print(path, 'candidate_count=', len(candidates))
              for value, source in candidates:
                  print(' ', source, hashlib.sha256(value.encode('ascii')).hexdigest())
              candidate_sets.append(candidates)

          combination_count = 1
          for candidates in candidate_sets:
              combination_count *= len(candidates)
          print('candidate_combination_count=', combination_count)
          if combination_count > 250000:
              raise SystemExit('historical candidate space unexpectedly large; refusing unsafe recovery')

          matches = []
          decoded_candidates = 0
          lzma_candidates = 0
          for combo in itertools.product(*candidate_sets):
              parts = [entry[0] for entry in combo]
              sources = [entry[1] for entry in combo]
              staged_b64 = ''.join(parts)
              try:
                  packed = base64.b64decode(staged_b64, validate=True)
              except Exception:
                  continue
              decoded_candidates += 1
              try:
                  html = lzma.decompress(packed)
              except lzma.LZMAError:
                  continue
              lzma_candidates += 1
              html_sha = hashlib.sha256(html).hexdigest()
              if len(html) != expected_html_bytes or html_sha != expected_html_sha:
                  continue
              try:
                  text = html.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              markers = ('no row caps, viewport culling', 'window.__EXPLORER_TEST__', 'Minecraft Recommendations Vault')
              if any(marker not in text for marker in markers):
                  continue
              matches.append((parts, sources, staged_b64, packed, html))

          print('base64_decodable_candidates=', decoded_candidates)
          print('lzma_decodable_candidates=', lzma_candidates)
          print('exact_html_matches=', len(matches))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one exact verified Explorer match, found {len(matches)}')

          parts, sources, staged_b64, packed, html = matches[0]
          for path, value in zip(stage_paths, parts):
              path.write_text(value, encoding='ascii')
          out = Path('Minecraft Recommendations Vault - Explorer.html')
          out.write_bytes(html)

          builder_b64_path = stage_dir / 'builder.py.xz.b64'
          if not builder_b64_path.is_file():
              raise SystemExit('missing reusable Explorer builder staging payload')
          builder_b64 = normalize(builder_b64_path.read_text(encoding='ascii'))
          builder = lzma.decompress(base64.b64decode(builder_b64, validate=True))
          builder_sha = hashlib.sha256(builder).hexdigest()
          if len(builder) != 23550 or builder_sha != expected_builder_sha:
              raise SystemExit(f'Explorer builder identity mismatch: bytes={len(builder)} sha256={builder_sha}')

          tool_dir = Path('tools/recommendations-explorer')
          tool_dir.mkdir(parents=True, exist_ok=True)
          (tool_dir / 'build_recommendations_explorer.py').write_bytes(builder)
          (tool_dir / 'README.md').write_text(
              '# Recommendations Vault Explorer builder\n\n'
              '`build_recommendations_explorer.py` regenerates the single-file Explorer from an `.xlsx` export of the canonical Google Sheet '
              '`Minecraft Recommendations Vault — Master Tracker`, emits source provenance, and preserves the full dataset with no row caps or viewport culling.\n',
              encoding='utf-8',
          )

          metadata = {
              'artifact': out.name,
              'artifactBytes': len(html),
              'artifactSha256': hashlib.sha256(html).hexdigest(),
              'sourceWorkbook': 'Minecraft Recommendations Vault — Master Tracker',
              'sourceDriveId': '1N5rGN1E6jk3LMcPLNoRVWi3-8QmFtOikBguvoCaAMMg',
              'sourceModifiedTime': '2026-08-29T22:28:18.260Z',
              'generatorVersion': 'recommendations-explorer/1.0.0',
              'generatorBytes': len(builder),
              'generatorSha256': builder_sha,
              'sheetCount': 14,
              'sourceRowCount': 587,
              'masterItemCount': 186,
              'publicationRecovery': {
                  'mode': 'exact-html-identity-search-across-git-history',
                  'candidateCombinationCount': combination_count,
                  'base64DecodableCandidates': decoded_candidates,
                  'lzmaDecodableCandidates': lzma_candidates,
                  'stagedBase64Length': len(staged_b64),
                  'stagedBase64Sha256': hashlib.sha256(staged_b64.encode('ascii')).hexdigest(),
                  'stagedXzBytes': len(packed),
                  'stagedXzSha256': hashlib.sha256(packed).hexdigest(),
                  'selectedSources': sources,
                  'verification': 'exact decompressed SHA-256 + byte size + semantic acceptance markers',
              },
          }
          Path('Minecraft Recommendations Vault - Explorer.build.json').write_text(
              json.dumps(metadata, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print('EXPLORER_RECOVERED', json.dumps(metadata, sort_keys=True))
          PY
          status=$?
          cat explorer-recovery.log
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Explorer recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-recovery-diagnostics
          path: explorer-recovery.log
          if-no-files-found: error
          retention-days: 7

      - name: Require exact recovery success
        if: steps.recover.outputs.exit_code != '0'
        shell: bash
        run: |
          echo 'Explorer exact-history recovery failed; diagnostics were uploaded for deterministic repair.' >&2
          exit 1

      - name: Publish exact Explorer and reusable builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '.github/mrv-explorer-staging/xzstage-'*.b64 \
                  'Minecraft Recommendations Vault - Explorer.html' \
                  'Minecraft Recommendations Vault - Explorer.build.json' \
                  'tools/recommendations-explorer/build_recommendations_explorer.py' \
                  'tools/recommendations-explorer/README.md'
          if git diff --cached --quiet; then
            echo 'GitHub already contains the exact verified Explorer build.'
            exit 0
          fi
          git commit -m 'Publish exact verified Minecraft Recommendations Vault Explorer'
          git push
