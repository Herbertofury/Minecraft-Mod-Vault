name: RPG Series - Runes Forge 1.20.1

on:
  push:
    branches:
      - workbench/rpg-series-forge-1.20.1
    paths:
      - 'rpg-series-port/runes-forge-1.20.1/**'
      - '.github/workflows/rpg-series-runes-build.yml'
  workflow_dispatch:

concurrency:
  group: rpg-series-runes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rpg-series-port/runes-forge-1.20.1
    steps:
      - name: Checkout Mod Vault workbench
        uses: actions/checkout@v5

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"rpg-series/runes-forge-1.20.1","description":"Runes Forge 1.20.1 verification is running"}'

      - name: Checkout exact upstream Runes 1.3.2 resources
        uses: actions/checkout@v5
        with:
          repository: ZsoltMolnarrr/Runes
          ref: 96a89bb8f51f72a9087bbf1b1fb241d59c335d72
          path: _upstream/runes

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Prepare exact 1.3.2 resources for 1.20.1
        run: |
          set -euxo pipefail
          python tools/prepare_upstream_resources.py "$GITHUB_WORKSPACE/_upstream/runes" common/src/main/resources
          test "$(find common/src/main/resources -type f | wc -l)" -ge 91
          test "$(find common/src/main/resources -name '*.json' -type f | wc -l)" -ge 75
          test -f common/src/main/resources/assets/runes/textures/item/small_rune_pouch.png
          test -f common/src/main/resources/data/runes/recipes/pouch/small_rune_pouch.json
          test -f common/src/main/resources/data/runes/tags/items/runes.json
          if grep -R '"parent"[[:space:]]*:[[:space:]]*"runes:item/.*rune_pouch"' common/src/main/resources/assets/runes/models/item; then
            echo 'Filled pouch model recursively inherits a base override model' >&2
            exit 1
          fi

      - name: Build native Forge jar
        run: gradle --no-daemon --stacktrace :forge:build

      - name: Verify packaged jar
        run: |
          set -euxo pipefail
          JAR=$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev-shadow*' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR"
          unzip -p "$JAR" META-INF/mods.toml | grep -F 'modId="runes"'
          unzip -p "$JAR" META-INF/mods.toml | grep -F 'versionRange="[1.20.1,1.20.2)"'
          unzip -l "$JAR" | grep -F 'net/runes/forge/ForgeMod.class'
          unzip -l "$JAR" | grep -F 'net/runes/crafting/RunePouchItem.class'
          unzip -l "$JAR" | grep -F 'net/runes/compat/emi/RunesEmiPlugin.class'
          unzip -l "$JAR" | grep -F 'assets/runes/textures/item/small_rune_pouch.png'
          unzip -l "$JAR" | grep -F 'data/runes/recipes/pouch/small_rune_pouch.json'
          unzip -l "$JAR" | grep -F 'data/spell_engine/tags/items/spell_quiver.json'
          if unzip -l "$JAR" | grep -q 'META-INF/neoforge.mods.toml'; then
            echo 'Unexpected NeoForge metadata in final Forge jar' >&2
            exit 1
          fi
          if unzip -l "$JAR" | grep -q 'fabric.mod.json'; then
            echo 'Unexpected Fabric metadata in final Forge jar' >&2
            exit 1
          fi
          if unzip -p "$JAR" net/runes/client/RuneCraftingScreen.class | strings | grep -q 'net/fabricmc/api'; then
            echo 'Fabric Loader annotation leaked into final native Forge client class' >&2
            exit 1
          fi
          sha256sum "$JAR" | tee runes-forge.sha256

      - name: Smoke-test Forge 1.20.1 server + runtime pouch regression
        run: |
          set -euxo pipefail
          mkdir -p forge/run
          printf 'eula=true\n' > forge/run/eula.txt
          set +e
          timeout 180s gradle --no-daemon -PrunesCiSelfTest :forge:runServer > forge-server-smoke.log 2>&1
          STATUS=$?
          set -e
          cat forge-server-smoke.log
          test "$STATUS" -eq 0 -o "$STATUS" -eq 124
          LOG=$(find forge -type f -path '*/logs/latest.log' | head -n 1)
          test -n "$LOG"
          grep -E 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)! For help' "$LOG"
          grep -F '[Runes CI] Runtime self-test passed' forge-server-smoke.log
          if grep -E 'MixinApplyError|InvalidMixinException|MixinTransformerError|Failed to load class|Exception in server tick loop|Failed to create mod instance|NoClassDefFoundError|IllegalStateException: \[Runes CI\]' "$LOG" forge-server-smoke.log; then
            echo 'Forge server smoke contains a fatal loader/mixin/self-test signature' >&2
            exit 1
          fi

      - name: Smoke-test client resource/model bootstrap
        run: |
          set -euxo pipefail
          rm -rf forge/run/logs
          set +e
          timeout 180s xvfb-run -a gradle --no-daemon :forge:runClient > forge-client-smoke.log 2>&1
          STATUS=$?
          set -e
          cat forge-client-smoke.log
          test "$STATUS" -eq 0 -o "$STATUS" -eq 124
          LOG=$(find forge -type f -path '*/logs/latest.log' | head -n 1)
          test -n "$LOG"
          grep -E 'Reloading ResourceManager|Backend library: LWJGL|OpenAL initialized' "$LOG"
          if grep -Ei 'MixinApplyError|InvalidMixinException|MixinTransformerError|Failed to create mod instance|NoClassDefFoundError.*runes|Failed to load model.*runes|Unable to load model.*runes|Using missing texture.*runes|Exception.*runes.*model' "$LOG" forge-client-smoke.log; then
            echo 'Forge client smoke contains a fatal Runes model/loader signature' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: runes-forge-1.20.1
          retention-days: 7
          path: |
            rpg-series-port/runes-forge-1.20.1/forge/build/libs/*.jar
            rpg-series-port/runes-forge-1.20.1/runes-forge.sha256
            rpg-series-port/runes-forge-1.20.1/forge-server-smoke.log
            rpg-series-port/runes-forge-1.20.1/forge-client-smoke.log
          if-no-files-found: error

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            cancelled) STATE=error ;;
            *) STATE=error ;;
          esac
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"rpg-series/runes-forge-1.20.1\",\"description\":\"Runes Forge 1.20.1 CI: ${JOB_STATUS}\"}"
