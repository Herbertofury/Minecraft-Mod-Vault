name: RPG Series - Runes Forge 1.20.1

on:
  push:
    branches:
      - workbench/rpg-series-forge-1.20.1
    paths:
      - 'rpg-series-port/runes-forge-1.20.1/**'
      - '.github/workflows/rpg-series-runes-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'rpg-series-port/runes-forge-1.20.1/**'
      - '.github/workflows/rpg-series-runes-build.yml'
  workflow_dispatch:

concurrency:
  group: rpg-series-runes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rpg-series-port/runes-forge-1.20.1
    steps:
      - name: Checkout Mod Vault workbench
        uses: actions/checkout@v5

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -d '{"state":"pending","context":"rpg-series/runes-forge-1.20.1","description":"Runes Forge 1.20.1 verification is running"}'

      - name: Checkout exact upstream Runes 1.3.2 resources
        uses: actions/checkout@v5
        with:
          repository: ZsoltMolnarrr/Runes
          ref: 96a89bb8f51f72a9087bbf1b1fb241d59c335d72
          path: _upstream/runes

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Prepare exact 1.3.2 resources for 1.20.1
        run: |
          set -euxo pipefail
          python tools/prepare_upstream_resources.py "$GITHUB_WORKSPACE/_upstream/runes" common/src/main/resources
          test "$(find common/src/main/resources -type f | wc -l)" -ge 91
          test "$(find common/src/main/resources -name '*.json' -type f | wc -l)" -ge 75
          test -f common/src/main/resources/assets/runes/textures/item/small_rune_pouch.png
          test -f common/src/main/resources/data/runes/recipes/pouch/small_rune_pouch.json
          test -f common/src/main/resources/data/runes/tags/items/runes.json
          if grep -R '"parent"[[:space:]]*:[[:space:]]*"runes:item/.*rune_pouch"' common/src/main/resources/assets/runes/models/item; then
            echo 'Filled pouch model recursively inherits a base override model' >&2
            exit 1
          fi

      - name: Build native Forge jar
        run: gradle --no-daemon --stacktrace :forge:build

      - name: Verify packaged jar
        run: |
          set -euxo pipefail
          JAR=$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev-shadow*' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR"
          unzip -p "$JAR" META-INF/mods.toml | grep -F 'modId="runes"'
          unzip -p "$JAR" META-INF/mods.toml | grep -F 'versionRange="[1.20.1,1.20.2)"'
          unzip -l "$JAR" | grep -F 'net/runes/forge/ForgeMod.class'
          unzip -l "$JAR" | grep -F 'net/runes/crafting/RunePouchItem.class'
          unzip -l "$JAR" | grep -F 'net/runes/compat/emi/RunesEmiPlugin.class'
          unzip -l "$JAR" | grep -F 'assets/runes/textures/item/small_rune_pouch.png'
          unzip -l "$JAR" | grep -F 'data/runes/recipes/pouch/small_rune_pouch.json'
          unzip -l "$JAR" | grep -F 'data/spell_engine/tags/items/spell_quiver.json'
          if unzip -l "$JAR" | grep -q 'META-INF/neoforge.mods.toml'; then
            echo 'Unexpected NeoForge metadata in final Forge jar' >&2
            exit 1
          fi
          if unzip -l "$JAR" | grep -q 'fabric.mod.json'; then
            echo 'Unexpected Fabric metadata in final Forge jar' >&2
            exit 1
          fi
          if unzip -p "$JAR" net/runes/client/RuneCraftingScreen.class | strings | grep -q 'net/fabricmc/api'; then
            echo 'Fabric Loader annotation leaked into final native Forge client class' >&2
            exit 1
          fi
          sha256sum "$JAR" | tee runes-forge.sha256

      - name: Smoke-test Forge server + runtime pouch regression (fail-fast)
        run: |
          set -euo pipefail
          rm -rf forge/run/logs
          mkdir -p forge/run
          printf 'eula=true\n' > forge/run/eula.txt
          : > forge-server-smoke.log

          setsid gradle --no-daemon -PrunesCiSelfTest :forge:runServer > forge-server-smoke.log 2>&1 &
          PID=$!
          DEADLINE=$((SECONDS + 180))
          PASS=0
          FATAL='MixinApplyError|InvalidMixinException|MixinTransformerError|Failed to load class|Failed to start the minecraft server|Failed to create mod instance|NoClassDefFoundError|IllegalStateException: \[Runes CI\]|Exception in server tick loop'

          stop_group() {
            kill -TERM -- -"$PID" 2>/dev/null || true
            sleep 1
            kill -KILL -- -"$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }

          while (( SECONDS < DEADLINE )); do
            LOG=$(find forge/run -type f -path '*/logs/latest.log' | head -n 1 || true)
            FILES=(forge-server-smoke.log)
            [[ -n "$LOG" ]] && FILES+=("$LOG")

            if grep -Eiq "$FATAL" "${FILES[@]}"; then
              stop_group
              cat forge-server-smoke.log
              [[ -n "$LOG" ]] && cat "$LOG"
              echo 'Forge server smoke hit a fatal signature' >&2
              exit 1
            fi

            if grep -Fq '[Runes CI] Runtime self-test passed' forge-server-smoke.log \
              && [[ -n "$LOG" ]] \
              && grep -Eq 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)! For help' "$LOG"; then
              PASS=1
              break
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              wait "$PID" || STATUS=$?
              cat forge-server-smoke.log
              [[ -n "$LOG" ]] && cat "$LOG"
              echo "Forge server exited before verification completed (status ${STATUS:-0})" >&2
              exit 1
            fi
            sleep 1
          done

          if [[ "$PASS" -ne 1 ]]; then
            stop_group
            cat forge-server-smoke.log
            echo 'Forge server smoke timed out before verification markers' >&2
            exit 1
          fi

          stop_group
          LOG=$(find forge/run -type f -path '*/logs/latest.log' | head -n 1)
          grep -F '[Runes CI] Runtime self-test passed' forge-server-smoke.log
          grep -E 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)! For help' "$LOG"
          if grep -Eiq "$FATAL" forge-server-smoke.log "$LOG"; then
            echo 'Fatal signature appeared after successful server markers' >&2
            exit 1
          fi

      - name: Smoke-test client resource/model bootstrap (fail-fast)
        run: |
          set -euo pipefail
          rm -rf forge/run/logs
          : > forge-client-smoke.log

          setsid xvfb-run -a gradle --no-daemon :forge:runClient > forge-client-smoke.log 2>&1 &
          PID=$!
          DEADLINE=$((SECONDS + 180))
          READY_AT=0
          PASS=0
          FATAL='MixinApplyError|InvalidMixinException|MixinTransformerError|Failed to create mod instance|NoClassDefFoundError.*runes|Failed to load model.*runes|Unable to load model.*runes|Using missing texture.*runes|Exception.*runes.*model|The game crashed whilst initializing game'

          stop_group() {
            kill -TERM -- -"$PID" 2>/dev/null || true
            sleep 1
            kill -KILL -- -"$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }

          while (( SECONDS < DEADLINE )); do
            LOG=$(find forge/run -type f -path '*/logs/latest.log' | head -n 1 || true)
            FILES=(forge-client-smoke.log)
            [[ -n "$LOG" ]] && FILES+=("$LOG")

            if grep -Eiq "$FATAL" "${FILES[@]}"; then
              stop_group
              cat forge-client-smoke.log
              [[ -n "$LOG" ]] && cat "$LOG"
              echo 'Forge client smoke hit a fatal Runes loader/model signature' >&2
              exit 1
            fi

            if [[ -n "$LOG" ]] \
              && grep -Fq 'Reloading ResourceManager' "$LOG" \
              && grep -Eq 'Backend library: LWJGL|OpenAL initialized' "$LOG"; then
              if [[ "$READY_AT" -eq 0 ]]; then READY_AT=$SECONDS; fi
              if (( SECONDS - READY_AT >= 8 )); then PASS=1; break; fi
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              wait "$PID" || STATUS=$?
              cat forge-client-smoke.log
              [[ -n "$LOG" ]] && cat "$LOG"
              echo "Forge client exited before resource verification completed (status ${STATUS:-0})" >&2
              exit 1
            fi
            sleep 1
          done

          if [[ "$PASS" -ne 1 ]]; then
            stop_group
            cat forge-client-smoke.log
            echo 'Forge client smoke timed out before resource/model verification markers' >&2
            exit 1
          fi

          stop_group
          LOG=$(find forge/run -type f -path '*/logs/latest.log' | head -n 1)
          grep -F 'Reloading ResourceManager' "$LOG"
          grep -E 'Backend library: LWJGL|OpenAL initialized' "$LOG"
          if grep -Eiq "$FATAL" forge-client-smoke.log "$LOG"; then
            echo 'Fatal Runes client signature appeared after successful client markers' >&2
            exit 1
          fi

      - name: Preserve CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runes-forge-1.20.1
          retention-days: 7
          path: |
            rpg-series-port/runes-forge-1.20.1/forge/build/libs/*.jar
            rpg-series-port/runes-forge-1.20.1/runes-forge.sha256
            rpg-series-port/runes-forge-1.20.1/forge-server-smoke.log
            rpg-series-port/runes-forge-1.20.1/forge-client-smoke.log
            rpg-series-port/runes-forge-1.20.1/forge/run/logs/latest.log
          if-no-files-found: warn

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            cancelled) STATE=error ;;
            *) STATE=error ;;
          esac
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"rpg-series/runes-forge-1.20.1\",\"description\":\"Runes Forge 1.20.1 CI: ${JOB_STATUS}\"}"
