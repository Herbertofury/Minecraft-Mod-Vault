name: Mob Charms compatibility fetch

on:
  push:
    branches:
      - mob-charms-compat-fetch
  workflow_dispatch:

permissions:
  contents: read

env:
  MC_VERSION: "1.20.1"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest compatible mod files and required dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          mkdir -p out/forge out/fabric-reference

          cat > /tmp/fetch_mods.py <<'PY'
          import json, os, pathlib, hashlib, urllib.parse, urllib.request, time

          API='https://api.modrinth.com/v2'
          MC='1.20.1'
          UA='MobCharms-Compat-Fetch/1.0 (github.com/Herbertofury/Minecraft-Mod-Vault)'
          OUT=pathlib.Path('out')

          targets = [
              # Primary Forge 1.20.1 runtime matrix
              ('curios', 'forge', 'forge'),
              ('relics-mod', 'forge', 'forge'),
              ('artifacts', 'forge', 'forge'),
              ('enigmatic-legacy', 'forge', 'forge'),
              ('apotheosis', 'forge', 'forge'),
              ('better-combat', 'forge', 'forge'),
              ('punchy-fpa', 'forge', 'forge'),
              ('simply-swords', 'forge', 'forge'),
              ('spartan-weaponry', 'forge', 'forge'),
              # Cross-loader reference matrix retained beside project
              ('accessories', 'fabric', 'fabric-reference'),
              ('trinkets', 'fabric', 'fabric-reference'),
              ('jewelry', 'fabric', 'fabric-reference'),
              ('additional-rpg-jewelry', 'fabric', 'fabric-reference'),
              ('things', 'fabric', 'fabric-reference'),
          ]

          def get_json(url):
              req=urllib.request.Request(url, headers={'User-Agent':UA})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def versions(project, loader):
              params=urllib.parse.urlencode({
                  'loaders': json.dumps([loader]),
                  'game_versions': json.dumps([MC]),
              })
              return get_json(f'{API}/project/{urllib.parse.quote(project)}/version?{params}')

          def pick_latest(project, loader):
              vs=versions(project, loader)
              if not vs:
                  raise RuntimeError(f'No {loader} {MC} versions for {project}')
              # API is usually newest-first, but sort explicitly.
              vs.sort(key=lambda v:v.get('date_published',''), reverse=True)
              # Prefer release, then beta/alpha only if no release exists.
              releases=[v for v in vs if v.get('version_type')=='release']
              return (releases or vs)[0]

          seen=set()
          manifest=[]

          def download_version(v, bucket, requested_by, target_name=None):
              vid=v['id']
              key=(vid,bucket)
              if key in seen:
                  return
              seen.add(key)
              files=v.get('files') or []
              primary=next((f for f in files if f.get('primary')), files[0] if files else None)
              if not primary:
                  raise RuntimeError(f'No file for version {vid}')
              folder=OUT/bucket
              folder.mkdir(parents=True, exist_ok=True)
              filename=primary['filename']
              dest=folder/filename
              req=urllib.request.Request(primary['url'], headers={'User-Agent':UA})
              with urllib.request.urlopen(req, timeout=120) as r, open(dest,'wb') as w:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      w.write(b)
              raw=dest.read_bytes()
              sha256=hashlib.sha256(raw).hexdigest()
              expected=(primary.get('hashes') or {}).get('sha512')
              if expected and hashlib.sha512(raw).hexdigest()!=expected:
                  raise RuntimeError(f'SHA512 mismatch: {filename}')
              manifest.append({
                  'target': target_name,
                  'requested_by': requested_by,
                  'project_id': v.get('project_id'),
                  'version_id': vid,
                  'version_number': v.get('version_number'),
                  'version_name': v.get('name'),
                  'date_published': v.get('date_published'),
                  'version_type': v.get('version_type'),
                  'loaders': v.get('loaders'),
                  'game_versions': v.get('game_versions'),
                  'filename': filename,
                  'size': len(raw),
                  'sha256': sha256,
                  'source_url': primary['url'],
                  'bucket': bucket,
              })
              # Pull required Modrinth dependencies into the same bucket.
              for dep in v.get('dependencies') or []:
                  if dep.get('dependency_type')!='required':
                      continue
                  if dep.get('version_id'):
                      dv=get_json(f"{API}/version/{dep['version_id']}")
                  elif dep.get('project_id'):
                      try:
                          dv=pick_latest(dep['project_id'], 'forge' if bucket=='forge' else 'fabric')
                      except Exception:
                          # Some libraries are loader-neutral; pick latest 1.20.1 regardless of loader.
                          params=urllib.parse.urlencode({'game_versions':json.dumps([MC])})
                          cand=get_json(f"{API}/project/{dep['project_id']}/version?{params}")
                          if not cand: raise
                          cand.sort(key=lambda x:x.get('date_published',''), reverse=True)
                          dv=cand[0]
                  else:
                      continue
                  download_version(dv, bucket, f'dependency-of:{vid}', target_name=None)

          failures=[]
          for project, loader, bucket in targets:
              try:
                  v=pick_latest(project, loader)
                  download_version(v, bucket, 'requested-target', target_name=project)
              except Exception as e:
                  failures.append({'project':project,'loader':loader,'error':repr(e)})

          (OUT/'manifest.json').write_text(json.dumps({'minecraft':MC,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'files':manifest,'failures':failures}, indent=2), encoding='utf-8')
          with open(OUT/'SHA256SUMS.txt','w',encoding='utf-8') as f:
              for row in sorted(manifest,key=lambda r:(r['bucket'],r['filename'])):
                  f.write(f"{row['sha256']}  {row['bucket']}/{row['filename']}\n")
          if failures:
              print('Resolution failures:', json.dumps(failures, indent=2))
          # Fail only if a primary Forge target is missing; reference-only failures remain documented.
          primary={p for p,l,b in targets if b=='forge'}
          got={r['target'] for r in manifest if r.get('target') and r['bucket']=='forge'}
          missing=sorted(primary-got)
          if missing:
              raise SystemExit('Missing primary Forge targets: '+', '.join(missing))
          PY
          python /tmp/fetch_mods.py
          find out -type f -maxdepth 2 -printf '%P\n' | sort
          cat out/manifest.json

      - name: Upload compatibility bundle
        uses: actions/upload-artifact@v4
        with:
          name: mob-charms-compat-1.20.1
          path: out/
          compression-level: 0
          if-no-files-found: error
