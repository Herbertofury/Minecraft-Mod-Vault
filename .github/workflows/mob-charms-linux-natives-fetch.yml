name: Mob Charms Linux Natives Fetch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mob-charms-linux-natives-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify Minecraft 1.20.1 LWJGL Linux natives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd out
          fetch() { expected="$1"; url="$2"; file="${url##*/}"; curl -fL --retry 4 --retry-delay 2 -o "$file" "$url"; actual=$(sha1sum "$file" | awk '{print $1}'); test "$actual" = "$expected"; }
          fetch 81716978214ecbda15050ca394b06ef61501a49e https://libraries.minecraft.net/org/lwjgl/lwjgl-glfw/3.3.1/lwjgl-glfw-3.3.1-natives-linux.jar
          fetch 33dbb017b6ed6b25f993ad9d56741a49e7937718 https://libraries.minecraft.net/org/lwjgl/lwjgl-jemalloc/3.3.1/lwjgl-jemalloc-3.3.1-natives-linux.jar
          fetch f906b6439f6daa66001182ea7727e3467a93681b https://libraries.minecraft.net/org/lwjgl/lwjgl-openal/3.3.1/lwjgl-openal-3.3.1-natives-linux.jar
          fetch ab9ab6fde3743e3550fa5d46d785ecb45b047d99 https://libraries.minecraft.net/org/lwjgl/lwjgl-opengl/3.3.1/lwjgl-opengl-3.3.1-natives-linux.jar
          fetch 3ee7aec8686e52867677110415566a5342a80230 https://libraries.minecraft.net/org/lwjgl/lwjgl-stb/3.3.1/lwjgl-stb-3.3.1-natives-linux.jar
          fetch a35110b9471bea8cde826ab297550ee8c22f5035 https://libraries.minecraft.net/org/lwjgl/lwjgl-tinyfd/3.3.1/lwjgl-tinyfd-3.3.1-natives-linux.jar
          fetch 1de885aba434f934201b99f2f1afb142036ac189 https://libraries.minecraft.net/org/lwjgl/lwjgl/3.3.1/lwjgl-3.3.1-natives-linux.jar
          sha256sum *.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mob-charms-mc-1.20.1-linux-natives
          path: out/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
