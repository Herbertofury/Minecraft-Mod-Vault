name: Promote Vanilla Atlas Builder Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-vanilla-atlas-builder-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote tested 2.6.1 builder fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('devkit-orchestrator/tools/build_vanilla_atlas.py')
          s=p.read_text()
          s=s.replace('Minecraft-Dev-Kit-Vanilla-Feature-Atlas/2.6.0','Minecraft-Dev-Kit-Vanilla-Feature-Atlas/2.6.1')
          needle='clone_repo("https://github.com/PrismarineJS/minecraft-data.git", minecraft_data, depth=1)\n'
          repl=needle+'    run(["git", "checkout", "--detach", "HEAD"], cwd=minecraft_data, capture=False)\n'
          if repl not in s:
              if needle not in s: raise SystemExit('minecraft-data checkout anchor missing')
              s=s.replace(needle,repl)
          start=s.index('def branch_version_commits(')
          end=s.index('\n\ndef ns(', start)
          new='''def branch_version_commits(repo: Path, branch: str) -> list[tuple[str, str]]:\n    commits = run(["git", "rev-list", "--reverse", f"origin/{branch}"], cwd=repo).splitlines()\n    out = []\n    by_version = {}\n    def version_for(commit):\n        raw = git_show(repo, commit, "version.txt")\n        if raw:\n            v = raw.decode("utf-8", "replace").strip()\n            if v:\n                return v\n        raw = git_show(repo, commit, "version.json")\n        if raw:\n            try:\n                obj = json.loads(raw.decode("utf-8"))\n                v = str(obj.get("id") or "").strip()\n                if v:\n                    return v\n            except Exception:\n                pass\n        return ""\n    cache = {}\n    for c in commits:\n        v = cache[c] = version_for(c)\n        if v:\n            by_version[v] = c\n    for c in commits:\n        v = cache.get(c, "")\n        if v and by_version.get(v) == c:\n            out.append((v, c))\n    return out\n'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
          python3 -m py_compile devkit-orchestrator/tools/build_vanilla_atlas.py
          git config user.name 'Minecraft Dev Kit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add devkit-orchestrator/tools/build_vanilla_atlas.py
          if git diff --cached --quiet; then
            echo 'builder already promoted'
            exit 0
          fi
          git commit -m 'devkit: finalize vanilla atlas builder 2.6.1'
          git push origin HEAD:main
