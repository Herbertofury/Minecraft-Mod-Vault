name: Noxviola Dependency Fetch

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/noxviola-dependency-fetch.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Noxviola FREEZE_DATA suspects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/noxviola-freeze-data
          cd /tmp/noxviola-freeze-data

          curl -fL --retry 4 --retry-delay 2 \
            -o 'deep_aether-1.20.1-1.1.7.jar' \
            'https://mediafilez.forgecdn.net/files/6839/617/deep_aether-1.20.1-1.1.7.jar'

          curl -fL --retry 4 --retry-delay 2 \
            -o 'hybrid_aquatic-forge-1.20.1-1.7.0.jar' \
            'https://mediafilez.forgecdn.net/files/8763/630/hybrid_aquatic-forge-1.20.1-1.7.0.jar'

          curl -fL --retry 4 --retry-delay 2 \
            -o 'youre-in-grave-danger-forge-1.20.1-2.0.19.jar' \
            'https://mediafilez.forgecdn.net/files/7611/933/youre-in-grave-danger-forge-1.20.1-2.0.19.jar'

          file *.jar
          for f in *.jar; do unzip -t "$f" >/dev/null; done
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: noxviola-freeze-data-binaries
          path: /tmp/noxviola-freeze-data
          if-no-files-found: error
          retention-days: 1
