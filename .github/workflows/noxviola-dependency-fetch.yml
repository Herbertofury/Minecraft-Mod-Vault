name: Noxviola Dependency Fetch

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/noxviola-dependency-fetch.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact compatibility patch binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/noxviola-compat
          cd /tmp/noxviola-compat

          curl -fL --retry 4 --retry-delay 2 \
            -o tomagic_cataclysm_compat-1.5.0.jar \
            'https://github.com/Nicepower001/TOMagicCataclysmCompat/releases/download/1.5.0/tomagic_cataclysm_compat-1.5.0.jar'

          curl -fL --retry 4 --retry-delay 2 \
            -o mndfix-1.12.0-all.jar \
            'https://mediafilez.forgecdn.net/files/8618/637/mndfix-1.12.0-all.jar'

          file *.jar
          for f in *.jar; do unzip -t "$f" >/dev/null; done
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: noxviola-compat-patches
          path: /tmp/noxviola-compat
          if-no-files-found: error
          retention-days: 1
