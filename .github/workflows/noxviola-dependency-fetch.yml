name: Noxviola Dependency Fetch

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/noxviola-dependency-fetch.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact public Noxviola dependency binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/noxviola-deps
          cd /tmp/noxviola-deps
          curl -fL --retry 4 --retry-delay 2 -o traveloptics-6.3.0-1.20.1.jar 'https://mediafilez.forgecdn.net/files/7424/522/traveloptics-6.3.0-1.20.1.jar'
          curl -fL --retry 4 --retry-delay 2 -o compatdelight-1.0.1.1.jar 'https://cdn.modrinth.com/data/iNJJU8Ib/versions/akFeLxqb/compatdelight-1.0.1.1.jar'
          curl -fL --retry 4 --retry-delay 2 -o L_Enders_Cataclysm-3.31.jar 'https://mediafilez.forgecdn.net/files/8246/047/L_Enders_Cataclysm-3.31.jar'
          curl -fL --retry 4 --retry-delay 2 -o FarmersDelight-1.20.1-1.3.4.jar 'https://mediafilez.forgecdn.net/files/8765/179/FarmersDelight-1.20.1-1.3.4.jar'
          file *.jar
          for f in *.jar; do unzip -t "$f" >/dev/null; done
          sha256sum *.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: noxviola-dependency-binaries
          path: /tmp/noxviola-deps
          if-no-files-found: error
          retention-days: 1
