name: Ragdoll Forge Run Config Export

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ragdoll-port/**'
      - '.github/workflows/ragdoll-runconfig-export.yml'

permissions:
  contents: read

jobs:
  export:
    if: startsWith(github.head_ref, 'ragdoll-forge-1.20.1-port')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Forge 47.4.23 MDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ragdoll-run/mdk
          curl -fL --retry 4 --retry-delay 2 -o /tmp/ragdoll-run/forge-mdk.zip 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-mdk.zip'
          echo 'b046c49aaa7aef022b9cbe1c2aceb441c7ea43c3  /tmp/ragdoll-run/forge-mdk.zip' | sha1sum -c -
          unzip -q /tmp/ragdoll-run/forge-mdk.zip -d /tmp/ragdoll-run/mdk
          chmod +x /tmp/ragdoll-run/mdk/gradlew
      - name: Add Ragdollified and dump task
        shell: bash
        run: |
          cat >> /tmp/ragdoll-run/mdk/build.gradle <<'GRADLE'

          repositories { maven { url = 'https://www.cursemaven.com' } }
          dependencies { compileOnly fg.deobf('curse.maven:ragdollified-1417732:8704143') }

          tasks.register('dumpRunServerConfig') {
              doLast {
                  def rt = tasks.named('runServer').get()
                  def out = layout.buildDirectory.file('run-export/run-server.txt').get().asFile
                  out.parentFile.mkdirs()
                  out.withWriter('UTF-8') { w ->
                      w.println("taskClass=${rt.class.name}")
                      ['main','mainClass','args','jvmArgs','systemProperties','environment','workingDir'].each { k ->
                          try { w.println("${k}=${rt.properties[k]}") } catch (Throwable t) { w.println("${k}=<${t.class.simpleName}>") }
                      }
                      try { w.println("classpath=${rt.classpath.files.collect { it.absolutePath }.sort().join(File.pathSeparator)}") } catch (Throwable t) { w.println("classpath=<${t.class.simpleName}>") }
                  }
              }
          }
          GRADLE
      - name: Export exact runServer configuration
        working-directory: /tmp/ragdoll-run/mdk
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace dumpRunServerConfig
          ./gradlew --no-daemon tasks --all > build/run-export/tasks.txt
          find build -maxdepth 4 -type f \( -name '*args*' -o -name '*classpath*' -o -name '*run*' \) -print > build/run-export/run-files.txt || true
          env | sort | grep -E '^(MOD_CLASSES|MCP_|FORGE_|JAVA_|GRADLE_)' > build/run-export/ci-env.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: ragdoll-forge-run-config
          path: /tmp/ragdoll-run/mdk/build/run-export
          if-no-files-found: error
          retention-days: 7
