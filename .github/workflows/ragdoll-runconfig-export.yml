name: Ragdoll Forge Run Config Export

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ragdoll-port/**'
      - '.github/workflows/ragdoll-runconfig-export.yml'

permissions:
  contents: read

jobs:
  export:
    if: startsWith(github.head_ref, 'ragdoll-forge-1.20.1-port')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Forge 47.4.23 MDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ragdoll-run/mdk
          curl -fL --retry 4 --retry-delay 2 -o /tmp/ragdoll-run/forge-mdk.zip 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-mdk.zip'
          echo 'b046c49aaa7aef022b9cbe1c2aceb441c7ea43c3  /tmp/ragdoll-run/forge-mdk.zip' | sha1sum -c -
          unzip -q /tmp/ragdoll-run/forge-mdk.zip -d /tmp/ragdoll-run/mdk
          chmod +x /tmp/ragdoll-run/mdk/gradlew
      - name: Add exact Ragdollified dependency
        shell: bash
        run: |
          cat >> /tmp/ragdoll-run/mdk/build.gradle <<'GRADLE'

          repositories { maven { url = 'https://www.cursemaven.com' } }
          dependencies { compileOnly fg.deobf('curse.maven:ragdollified-1417732:8704143') }
          GRADLE
      - name: Execute ForgeGradle runServer and capture real launch
        working-directory: /tmp/ragdoll-run/mdk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/run-export
          set +e
          timeout 150s ./gradlew --no-daemon --info --stacktrace runServer > build/run-export/runserver-console.txt 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > build/run-export/runserver-exit-code.txt
          grep -nE 'Starting process .*java|Command: .*java|Process .* started|net\.minecraftforge|cpw\.mods\.bootstraplauncher|--module-path|--class-path|legacyClassPath|MOD_CLASSES' build/run-export/runserver-console.txt > build/run-export/launch-lines.txt || true
          find build run -type f \( -name '*args*' -o -name '*.log' -o -name '*classpath*' -o -name '*run*.txt' \) -print 2>/dev/null | sort > build/run-export/run-files.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.log|*.txt|*args*|*classpath*)
                mkdir -p "build/run-export/files/$(dirname "$f")"
                cp "$f" "build/run-export/files/$f" || true
                ;;
            esac
          done < build/run-export/run-files.txt
          env | sort | grep -E '^(MOD_CLASSES|MCP_|FORGE_|JAVA_|GRADLE_)' > build/run-export/ci-env.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: ragdoll-forge-run-config
          path: /tmp/ragdoll-run/mdk/build/run-export
          if-no-files-found: error
          retention-days: 7
