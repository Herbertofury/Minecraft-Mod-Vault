name: Prewarm Minecraft 1.20.1 Assets

on:
  push:
    branches: [main]
    paths: ['.github/workflows/prewarm-minecraft-1.20.1-assets.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and verify official Mojang 1.20.1 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/assets/indexes work/assets/objects out/parts
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, urllib.request, time
          MC='1.20.1'; root=pathlib.Path('work/assets'); indexes=root/'indexes'; objects=root/'objects'; out=pathlib.Path('out')
          def get(url, timeout=60):
              req=urllib.request.Request(url, headers={'User-Agent':'Minecraft-Dev-Kit-Asset-Prewarm/1.0'})
              with urllib.request.urlopen(req, timeout=timeout) as r: return r.read()
          manifest_url='https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'
          manifest_bytes=get(manifest_url); manifest=json.loads(manifest_bytes)
          version=next(v for v in manifest['versions'] if v['id']==MC)
          version_bytes=get(version['url'])
          if hashlib.sha1(version_bytes).hexdigest()!=version['sha1']: raise SystemExit('version JSON SHA-1 mismatch')
          version_json=json.loads(version_bytes); asset=version_json['assetIndex']; index_bytes=get(asset['url'])
          if hashlib.sha1(index_bytes).hexdigest()!=asset['sha1']: raise SystemExit('asset index SHA-1 mismatch')
          index_name=asset['id']; (indexes/f'{index_name}.json').write_bytes(index_bytes); asset_index=json.loads(index_bytes)
          unique={}
          for meta in asset_index['objects'].values():
              h=meta['hash']; size=int(meta['size'])
              if h in unique and unique[h]!=size: raise SystemExit(f'conflicting size for {h}')
              unique[h]=size
          def ensure(item):
              h,size=item; dst=objects/h[:2]/h; dst.parent.mkdir(parents=True,exist_ok=True); url=f'https://resources.download.minecraft.net/{h[:2]}/{h}'
              last=None
              for attempt in range(5):
                  try:
                      b=get(url,120)
                      if len(b)!=size or hashlib.sha1(b).hexdigest()!=h: raise ValueError('object integrity mismatch')
                      tmp=dst.with_suffix('.tmp'); tmp.write_bytes(b); os.replace(tmp,dst); return
                  except Exception as e:
                      last=e; time.sleep(1.5*(attempt+1))
              raise RuntimeError(f'{h}: {last}')
          total=len(unique)
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
              for i,fut in enumerate(concurrent.futures.as_completed([ex.submit(ensure,x) for x in unique.items()]),1):
                  fut.result()
                  if i%250==0 or i==total: print(f'verified {i}/{total}',flush=True)
          bad=[]; verified_bytes=0
          for h,size in unique.items():
              p=objects/h[:2]/h
              if not p.is_file() or p.stat().st_size!=size or hashlib.sha1(p.read_bytes()).hexdigest()!=h: bad.append(h)
              else: verified_bytes+=size
          if bad: raise SystemExit(f'asset verification failures count={len(bad)} first={bad[:10]}')
          (out/'version_manifest_v2.json').write_bytes(manifest_bytes); (out/f'{MC}.json').write_bytes(version_bytes)
          report={'minecraft':MC,'asset_index_id':index_name,'asset_index_sha1':asset['sha1'],'asset_index_size':asset['size'],'logical_object_entries':len(asset_index['objects']),'unique_object_hashes':total,'verified_object_bytes':verified_bytes,'expected_unique_object_bytes':sum(unique.values()),'complete':verified_bytes==sum(unique.values()),'source_hosts':['piston-meta.mojang.com','resources.download.minecraft.net']}
          (out/'ASSET-VERIFY.json').write_text(json.dumps(report,indent=2)+'\n'); print(json.dumps(report,indent=2))
          PY
      - name: Package and split reusable cache
        shell: bash
        run: |
          set -euo pipefail
          cp out/version_manifest_v2.json work/assets/version_manifest_v2.json
          cp out/1.20.1.json work/assets/1.20.1.json
          cp out/ASSET-VERIFY.json work/assets/ASSET-VERIFY.json
          tar --sort=name --mtime='UTC 2026-08-28' --owner=0 --group=0 --numeric-owner -C work -cf - assets | zstd -T0 -6 -o out/Minecraft-1.20.1-Official-Assets-Complete.tar.zst
          sha256sum out/Minecraft-1.20.1-Official-Assets-Complete.tar.zst > out/SHA256SUMS.txt
          sha256sum work/assets/indexes/*.json >> out/SHA256SUMS.txt
          split -b 80M -d -a 2 out/Minecraft-1.20.1-Official-Assets-Complete.tar.zst out/parts/Minecraft-1.20.1-Official-Assets-Complete.tar.zst.part-
          test "$(find out/parts -type f | wc -l)" -eq 7
          sha256sum out/parts/* > out/PARTS-SHA256SUMS.txt
          ls -lh out/parts; cat out/ASSET-VERIFY.json; cat out/SHA256SUMS.txt; cat out/PARTS-SHA256SUMS.txt
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with: {name: minecraft-1.20.1-assets-part-00, path: out/parts/Minecraft-1.20.1-Official-Assets-Complete.tar.zst.part-00, compression-level: 0, retention-days: 7}
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with: {name: minecraft-1.20.1-assets-part-01, path: out/parts/Minecraft-1.20.1-Official-Assets-Complete.tar.zst.part-01, compression-level: 0, retention-days: 7}
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with: {name: minecraft-1.20.1-assets-part-02, path: out/parts/Minecraft-1.20.1-Official-Assets-Complete.tar.zst.part-02, compression-level: 0, retention-days: 7}
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with: {name: minecraft-1.20.1-assets-part-03, path: out/parts/Minecraft-1.20.1-Official-Assets-Complete.tar.zst.part-03, compression-level: 0, retention-days: 7}
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with: {name: minecraft-1.20.1-assets-part-04, path: out/parts/Minecraft-1.20.1-Official-Assets-Complete.tar.zst.part-04, compression-level: 0, retention-days: 7}
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with: {name: minecraft-1.20.1-assets-part-05, path: out/parts/Minecraft-1.20.1-Official-Assets-Complete.tar.zst.part-05, compression-level: 0, retention-days: 7}
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with: {name: minecraft-1.20.1-assets-part-06, path: out/parts/Minecraft-1.20.1-Official-Assets-Complete.tar.zst.part-06, compression-level: 0, retention-days: 7}
      - name: Upload verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-assets-metadata
          path: |
            out/ASSET-VERIFY.json
            out/SHA256SUMS.txt
            out/PARTS-SHA256SUMS.txt
            out/1.20.1.json
            out/version_manifest_v2.json
          compression-level: 0
          retention-days: 7
