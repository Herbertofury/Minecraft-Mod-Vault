name: RPG Series - Structure Pool API Forge 1.20.1

on:
  push:
    branches:
      - workbench/rpg-series-forge-1.20.1
    paths:
      - 'rpg-series-port/structure_pool_api-forge-1.20.1/**'
      - '.github/workflows/rpg-series-structure-pool-build.yml'
  workflow_dispatch:

concurrency:
  group: rpg-series-structure-pool-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rpg-series-port/structure_pool_api-forge-1.20.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false
      - name: Build native Forge jar
        run: gradle --no-daemon --stacktrace :forge:build
      - name: Verify packaged jar
        run: |
          set -euxo pipefail
          JAR=$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev-shadow*' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR"
          unzip -p "$JAR" META-INF/mods.toml | grep -F 'modId="structure_pool_api"'
          unzip -l "$JAR" | grep -F 'net/fabric_extras/structure_pool/forge/ForgeMod.class'
          if unzip -l "$JAR" | grep -q 'META-INF/neoforge.mods.toml'; then
            echo 'Unexpected NeoForge metadata in final Forge jar' >&2
            exit 1
          fi
          sha256sum "$JAR" | tee structure-pool-api.sha256
      - name: Smoke-test Forge 1.20.1 dedicated server
        run: |
          set -euxo pipefail
          mkdir -p forge/run
          printf 'eula=true\n' > forge/run/eula.txt
          set +e
          timeout 180s gradle --no-daemon :forge:runServer > forge-server-smoke.log 2>&1
          STATUS=$?
          set -e
          cat forge-server-smoke.log
          test "$STATUS" -eq 0 -o "$STATUS" -eq 124
          LOG=$(find forge -type f -path '*/logs/latest.log' | head -n 1)
          test -n "$LOG"
          grep -E 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)! For help' "$LOG"
          if grep -E 'MixinApplyError|InvalidMixinException|MixinTransformerError|Failed to load class|Exception in server tick loop|Failed to create mod instance' "$LOG"; then
            echo 'Forge smoke log contains a fatal loader/mixin signature' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: structure-pool-api-forge-1.20.1
          path: |
            rpg-series-port/structure_pool_api-forge-1.20.1/forge/build/libs/*.jar
            rpg-series-port/structure_pool_api-forge-1.20.1/structure-pool-api.sha256
            rpg-series-port/structure_pool_api-forge-1.20.1/forge-server-smoke.log
            rpg-series-port/structure_pool_api-forge-1.20.1/forge/run/logs/latest.log
          if-no-files-found: error
