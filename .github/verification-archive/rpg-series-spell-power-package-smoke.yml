name: RPG Series - Spell Power Packaged JAR Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/rpg-series-spell-power-package-smoke.yml'
  workflow_dispatch:

concurrency:
  group: rpg-series-spell-power-package-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packaged-jar-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rpg-series-port/spell_power-forge-1.20.1
    steps:
      - name: Checkout exact Mod Vault workbench head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Snapshot exact tracked source overlay
        run: |
          set -euxo pipefail
          git -C "$GITHUB_WORKSPACE" archive --format=zip \
            --output="$GITHUB_WORKSPACE/spell-power-forge-1.20.1-source-final.zip" HEAD \
            rpg-series-port/spell_power-forge-1.20.1 \
            .github/workflows/rpg-series-spell-power-build.yml \
            .github/workflows/rpg-series-spell-power-package-smoke.yml
          unzip -t "$GITHUB_WORKSPACE/spell-power-forge-1.20.1-source-final.zip"

      - name: Checkout exact upstream 1.20.1 substrate
        uses: actions/checkout@v5
        with:
          repository: ZsoltMolnarrr/SpellPower
          ref: 681993d5f823aa96b1b24e21b145e89f46147f2d
          path: _upstream/spell120

      - name: Checkout exact upstream 1.6.0 reference
        uses: actions/checkout@v5
        with:
          repository: ZsoltMolnarrr/SpellPower
          ref: 6fed879e796cbe82c43684d914a8fa99a99e8b12
          path: _upstream/spell160

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Assemble and build release JAR
        run: |
          set -euxo pipefail
          python tools/prepare_upstream_source.py "$GITHUB_WORKSPACE/_upstream/spell120" "$GITHUB_WORKSPACE/_upstream/spell160" common
          gradle --no-daemon --stacktrace :forge:build
          JAR=$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev-shadow*' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR"
          sha256sum "$JAR" | tee spell-power-forge-final.sha256

      - name: Fresh standalone Forge install smoke using packaged JAR
        run: |
          set -euo pipefail
          JAR=$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev-shadow*' | head -n 1)
          FRESH="$GITHUB_WORKSPACE/_fresh_spell_power_server"
          rm -rf "$FRESH"
          mkdir -p "$FRESH/mods"
          cp "$JAR" "$FRESH/mods/"
          cd "$FRESH"

          curl -fsSLo forge-installer.jar \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar
          java -jar forge-installer.jar --installServer > forge-install.log 2>&1
          printf '%s\n' '-DspellPower.ci.selftest=true' > user_jvm_args.txt
          printf 'eula=true\n' > eula.txt
          : > packaged-jar-server-smoke.log

          chmod +x run.sh
          setsid ./run.sh nogui > packaged-jar-server-smoke.log 2>&1 &
          PID=$!
          DEADLINE=$((SECONDS + 180))
          PASS=0
          FATAL='MixinApplyError|InvalidMixinException|MixinTransformerError|Failed to start the minecraft server|Failed to create mod instance|NoClassDefFoundError|Registry is already frozen|IllegalStateException: \[Spell Power CI\]|Exception in server tick loop|ModLoadingException'

          stop_group() {
            kill -TERM -- -"$PID" 2>/dev/null || true
            sleep 1
            kill -KILL -- -"$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }

          while (( SECONDS < DEADLINE )); do
            FILES=(packaged-jar-server-smoke.log)
            [[ -f logs/latest.log ]] && FILES+=(logs/latest.log)
            if grep -Eiq "$FATAL" "${FILES[@]}"; then
              stop_group
              cat packaged-jar-server-smoke.log
              [[ -f logs/latest.log ]] && cat logs/latest.log
              echo 'Fresh packaged-JAR server hit fatal signature' >&2
              exit 1
            fi
            if grep -Fq '[Spell Power CI] Runtime self-test passed' packaged-jar-server-smoke.log \
              && [[ -f logs/latest.log ]] \
              && grep -Eq 'Done \([0-9.]+s\)!' logs/latest.log; then
              PASS=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              wait "$PID" || STATUS=$?
              cat packaged-jar-server-smoke.log
              [[ -f logs/latest.log ]] && cat logs/latest.log
              echo "Fresh packaged-JAR server exited early (${STATUS:-0})" >&2
              exit 1
            fi
            sleep 1
          done

          if [[ "$PASS" -ne 1 ]]; then
            stop_group
            cat packaged-jar-server-smoke.log
            [[ -f logs/latest.log ]] && cat logs/latest.log
            echo 'Fresh packaged-JAR server timed out before proof markers' >&2
            exit 1
          fi

          stop_group
          grep -F '[Spell Power CI] Runtime self-test passed' packaged-jar-server-smoke.log
          grep -E 'Done \([0-9.]+s\)!' logs/latest.log
          cp packaged-jar-server-smoke.log "$GITHUB_WORKSPACE/rpg-series-port/spell_power-forge-1.20.1/packaged-jar-server-smoke.log"
          cp forge-install.log "$GITHUB_WORKSPACE/rpg-series-port/spell_power-forge-1.20.1/forge-install.log"

      - name: Preserve fresh-install release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spell-power-forge-1.20.1-final
          retention-days: 7
          path: |
            spell-power-forge-1.20.1-source-final.zip
            rpg-series-port/spell_power-forge-1.20.1/forge/build/libs/spell_power-forge-1.6.0+1.20.1.jar
            rpg-series-port/spell_power-forge-1.20.1/spell-power-forge-final.sha256
            rpg-series-port/spell_power-forge-1.20.1/packaged-jar-server-smoke.log
            rpg-series-port/spell_power-forge-1.20.1/forge-install.log
          if-no-files-found: warn
