name: RPG Series - Spell Power Forge 1.20.1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'rpg-series-port/spell_power-forge-1.20.1/**'
      - '.github/workflows/rpg-series-spell-power-build.yml'
  workflow_dispatch:

concurrency:
  group: rpg-series-spell-power-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rpg-series-port/spell_power-forge-1.20.1
    steps:
      - name: Checkout exact Mod Vault workbench head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Snapshot exact tracked source overlay
        run: |
          set -euxo pipefail
          git -C "$GITHUB_WORKSPACE" archive --format=zip --output="$GITHUB_WORKSPACE/spell-power-forge-1.20.1-source.zip" HEAD rpg-series-port/spell_power-forge-1.20.1 .github/workflows/rpg-series-spell-power-build.yml
          unzip -t "$GITHUB_WORKSPACE/spell-power-forge-1.20.1-source.zip"

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -d '{"state":"pending","context":"rpg-series/spell-power-forge-1.20.1","description":"Spell Power Forge 1.20.1 verification is running"}'

      - name: Checkout exact upstream 1.20.1 substrate
        uses: actions/checkout@v5
        with:
          repository: ZsoltMolnarrr/SpellPower
          ref: 681993d5f823aa96b1b24e21b145e89f46147f2d
          path: _upstream/spell120

      - name: Checkout exact upstream 1.6.0 source/resources
        uses: actions/checkout@v5
        with:
          repository: ZsoltMolnarrr/SpellPower
          ref: 6fed879e796cbe82c43684d914a8fa99a99e8b12
          path: _upstream/spell160

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Assemble deterministic 1.20.1 source + 1.6.0 resources
        run: |
          set -euxo pipefail
          python tools/prepare_upstream_source.py "$GITHUB_WORKSPACE/_upstream/spell120" "$GITHUB_WORKSPACE/_upstream/spell160" common
          test -f common/src/generatedUpstream/java/net/spell_power/api/SpellSchool.java
          test ! -f common/src/generatedUpstream/java/net/spell_power/SpellPowerMod.java
          test ! -f common/src/generatedUpstream/java/net/spell_power/config/EnchantmentsConfig.java
          test ! -f common/src/generatedUpstream/java/net/spell_power/internals/AmplifierEnchantment.java
          test ! -f common/src/generatedUpstream/resources/fabric.mod.json
          test "$(find common/src/generatedUpstream/resources/assets/spell_power/lang -name '*.json' | wc -l)" -ge 20
          test -f common/src/generatedUpstream/resources/data/c/tags/damage_type/is_magic.json
          test -f common/src/generatedUpstream/resources/data/minecraft/tags/damage_type/panic_causes.json
          if grep -R 'net.fabricmc' common/src/main/java common/src/generatedUpstream/java; then echo 'Fabric loader/API reference leaked into native Forge common source' >&2; exit 1; fi

      - name: Build native Forge jar
        run: gradle --no-daemon --stacktrace :forge:build

      - name: Verify packaged jar
        run: |
          set -euxo pipefail
          JAR=$(find forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev-shadow*' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR"
          unzip -p "$JAR" META-INF/mods.toml | grep -F 'modId="spell_power"'
          unzip -p "$JAR" META-INF/mods.toml | grep -F 'versionRange="[1.20.1,1.20.2)"'
          unzip -l "$JAR" | grep -F 'net/spell_power/forge/ForgeMod.class'
          unzip -l "$JAR" | grep -F 'net/spell_power/api/DamageCurve.class'
          unzip -l "$JAR" | grep -F 'net/spell_power/internals/CriticalAmplifierEnchantment.class'
          unzip -l "$JAR" | grep -F 'net/spell_power/internals/MagicProtectionEnchantment.class'
          unzip -l "$JAR" | grep -F 'assets/spell_power/lang/ja_jp.json'
          unzip -l "$JAR" | grep -F 'data/c/tags/damage_type/is_magic.json'
          unzip -l "$JAR" | grep -F 'data/minecraft/tags/damage_type/panic_causes.json'
          unzip -l "$JAR" | grep -F 'META-INF/jars/TinyConfig-2.3.2.jar'
          if unzip -l "$JAR" | grep -q 'META-INF/neoforge.mods.toml\|fabric.mod.json'; then echo 'Non-Forge loader metadata leaked into final jar' >&2; exit 1; fi
          sha256sum "$JAR" | tee spell-power-forge.sha256

      - name: Smoke-test Forge server + 1.6 runtime invariants
        run: |
          set -euo pipefail
          rm -rf forge/run/logs; mkdir -p forge/run; printf 'eula=true\n' > forge/run/eula.txt; : > forge-server-smoke.log
          setsid gradle --no-daemon -PspellPowerCiSelfTest :forge:runServer > forge-server-smoke.log 2>&1 &
          PID=$!; DEADLINE=$((SECONDS + 180)); PASS=0
          FATAL='MixinApplyError|InvalidMixinException|MixinTransformerError|Failed to start the minecraft server|Failed to create mod instance|NoClassDefFoundError|Registry is already frozen|IllegalStateException: \[Spell Power CI\]|Exception in server tick loop'
          stop_group() { kill -TERM -- -"$PID" 2>/dev/null || true; sleep 1; kill -KILL -- -"$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          while (( SECONDS < DEADLINE )); do
            LOG=$(find forge/run -type f -path '*/logs/latest.log' | head -n 1 || true); FILES=(forge-server-smoke.log); [[ -n "$LOG" ]] && FILES+=("$LOG")
            if grep -Eiq "$FATAL" "${FILES[@]}"; then stop_group; cat forge-server-smoke.log; [[ -n "$LOG" ]] && cat "$LOG"; exit 1; fi
            if grep -Fq '[Spell Power CI] Runtime self-test passed' forge-server-smoke.log && [[ -n "$LOG" ]] && grep -Eq 'Done \([0-9.]+s\)!' "$LOG"; then PASS=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then wait "$PID" || STATUS=$?; cat forge-server-smoke.log; [[ -n "$LOG" ]] && cat "$LOG"; echo "server exited early ${STATUS:-0}" >&2; exit 1; fi
            sleep 1
          done
          [[ "$PASS" -eq 1 ]] || { stop_group; cat forge-server-smoke.log; exit 1; }; stop_group

      - name: Smoke-test Forge client resources
        run: |
          set -euo pipefail
          rm -rf forge/run/logs; : > forge-client-smoke.log
          setsid xvfb-run -a gradle --no-daemon :forge:runClient > forge-client-smoke.log 2>&1 &
          PID=$!; DEADLINE=$((SECONDS + 180)); READY_AT=0; PASS=0
          FATAL='MixinApplyError|InvalidMixinException|MixinTransformerError|Failed to create mod instance|NoClassDefFoundError.*spell_power|Using missing texture.*spell_power|The game crashed whilst initializing game'
          stop_group() { kill -TERM -- -"$PID" 2>/dev/null || true; sleep 1; kill -KILL -- -"$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          while (( SECONDS < DEADLINE )); do
            LOG=$(find forge/run -type f -path '*/logs/latest.log' | head -n 1 || true); FILES=(forge-client-smoke.log); [[ -n "$LOG" ]] && FILES+=("$LOG")
            if grep -Eiq "$FATAL" "${FILES[@]}"; then stop_group; cat forge-client-smoke.log; [[ -n "$LOG" ]] && cat "$LOG"; exit 1; fi
            if [[ -n "$LOG" ]] && grep -Fq 'Reloading ResourceManager' "$LOG" && grep -Eq 'Backend library: LWJGL|OpenAL initialized' "$LOG"; then [[ "$READY_AT" -eq 0 ]] && READY_AT=$SECONDS; (( SECONDS - READY_AT >= 8 )) && { PASS=1; break; }; fi
            if ! kill -0 "$PID" 2>/dev/null; then wait "$PID" || STATUS=$?; cat forge-client-smoke.log; [[ -n "$LOG" ]] && cat "$LOG"; exit 1; fi
            sleep 1
          done
          [[ "$PASS" -eq 1 ]] || { stop_group; cat forge-client-smoke.log; exit 1; }; stop_group

      - name: Preserve CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spell-power-forge-1.20.1
          retention-days: 7
          path: |
            spell-power-forge-1.20.1-source.zip
            rpg-series-port/spell_power-forge-1.20.1/forge/build/libs/*.jar
            rpg-series-port/spell_power-forge-1.20.1/spell-power-forge.sha256
            rpg-series-port/spell_power-forge-1.20.1/forge-server-smoke.log
            rpg-series-port/spell_power-forge-1.20.1/forge-client-smoke.log
          if-no-files-found: warn

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$JOB_STATUS" in success) STATE=success ;; failure) STATE=failure ;; *) STATE=error ;; esac
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -d "{\"state\":\"${STATE}\",\"context\":\"rpg-series/spell-power-forge-1.20.1\",\"description\":\"Spell Power Forge 1.20.1 CI: ${JOB_STATUS}\"}"
