plugins { id 'com.github.johnrengelman.shadow' }
architectury { platformSetupLoomIde(); forge() }
loom {
    forge { mixinConfig 'ranged_weapon_api.mixins.json' }
    runs {
        server {
            if (project.hasProperty('rangedWeaponCiSelfTest')) property 'rangedWeapon.ci.selftest', 'true'
        }
    }
}
configurations {
    common { canBeResolved=true; canBeConsumed=false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    shadowBundle { canBeResolved=true; canBeConsumed=false }
}
dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive=false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Official Architectury Loom MixinExtras pattern: implementation(include(...)) keeps
    // the injector classes on runServer/runClient while also embedding them for release.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:$rootProject.mixinextras_version"))
    implementation(include("io.github.llamalad7:mixinextras-forge:$rootProject.mixinextras_version"))
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand(version: project.version) }
}
shadowJar { configurations=[project.configurations.shadowBundle]; archiveClassifier='dev-shadow' }
remapJar { inputFile.set(shadowJar.archiveFile); dependsOn(shadowJar); archiveClassifier='' }
