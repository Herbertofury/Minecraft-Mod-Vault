architectury {
    common 'forge'
}

String requiredJar(String propertyName) {
    def value = providers.gradleProperty(propertyName).orNull
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException("Missing -P${propertyName}=/absolute/path/to/packaged-mod.jar")
    }
    def file = rootProject.file(value)
    if (!file.isFile()) {
        throw new GradleException("${propertyName} does not exist: ${file}")
    }
    return file.absolutePath
}

def externalMods = [
    requiredJar('bundle_api_jar'),
    requiredJar('armor_model_api_jar'),
    requiredJar('ranged_weapon_api_jar'),
    requiredJar('structure_pool_api_jar'),
    requiredJar('spell_power_jar'),
    requiredJar('spell_engine_jar'),
    requiredJar('tiny_config_jar'),
    requiredJar('cloth_config_jar'),
    requiredJar('player_animator_jar')
]

dependencies {
    externalMods.each { modImplementation files(it) }
}

sourceSets.main.resources.srcDir 'src/main/generated'
