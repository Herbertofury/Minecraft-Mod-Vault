architectury {
    common 'forge'
}

String requiredProperty(String propertyName) {
    def value = providers.gradleProperty(propertyName).orNull
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException("Missing -P${propertyName}=...")
    }
    return value.trim()
}

def abiRepo = rootProject.file(requiredProperty('archers_abi_repo'))
def abiVersion = requiredProperty('archers_abi_version')
if (!abiRepo.isDirectory()) {
    throw new GradleException("archers_abi_repo does not exist: ${abiRepo}")
}

repositories {
    // CI materializes the exact packaged Forge JARs into this commit-keyed Maven repo.
    // Declaring them as mod dependencies makes Loom remap their Mojmap/SRG signatures
    // into this common project's Yarn named namespace before javac sees them.
    maven { url = abiRepo.toURI() }
}

def externalMods = [
    'bundle-api',
    'armor-model-api',
    'ranged-weapon-api',
    'structure-pool-api',
    'spell-power',
    'spell-engine',
    'tiny-config',
    'cloth-config',
    'player-animator'
]

dependencies {
    externalMods.each { artifact ->
        modCompileOnly("local.archersabi:${artifact}:${abiVersion}") { transitive = false }
    }

    // Current Archers common source intentionally carries loader annotations and Sponge mixins.
    // These are compile-time only here; the native Forge runtime supplies Mixin itself and no
    // Fabric loader classes are packaged into Archers.
    compileOnly 'net.fabricmc:fabric-loader:0.15.11'
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

def generatedJava = rootProject.file('generated/common/java')
def generatedResources = rootProject.file('generated/common/resources')
sourceSets.main.java.setSrcDirs([generatedJava])
sourceSets.main.resources.setSrcDirs([generatedResources])

tasks.register('materializeCurrentArchers', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('materialize_port.sh').absolutePath
    outputs.dir generatedJava
    outputs.dir generatedResources
}
tasks.named('compileJava').configure { dependsOn 'materializeCurrentArchers' }
tasks.named('processResources').configure { dependsOn 'materializeCurrentArchers' }
