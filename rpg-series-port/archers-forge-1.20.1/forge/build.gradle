plugins { id 'com.github.johnrengelman.shadow' }
architectury { platformSetupLoomIde(); forge() }

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

File requiredJar(String propertyName) {
    def value = providers.gradleProperty(propertyName).orNull
    if (value == null || value.trim().isEmpty()) throw new GradleException("Missing -P${propertyName}=...")
    def file = rootProject.file(value.trim())
    if (!file.isFile()) throw new GradleException("${propertyName} does not exist: ${file}")
    return file
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Independent native-Forge ABI + runtime gate. These remain separately packaged release JARs:
    // compile/runtime visibility is provided to Loom, but nothing below is shaded into Archers.
    [
        requiredJar('bundle_api_forge_jar'),
        requiredJar('armor_model_api_forge_jar'),
        requiredJar('ranged_weapon_api_forge_jar'),
        requiredJar('structure_pool_api_forge_jar'),
        requiredJar('spell_power_forge_jar'),
        requiredJar('spell_engine_forge_jar'),
        requiredJar('tiny_config_forge_jar'),
        requiredJar('cloth_config_forge_jar'),
        requiredJar('player_animator_forge_jar'),
        requiredJar('curios_jar')
    ].each { jar ->
        modCompileOnly files(jar)
        modRuntimeOnly files(jar)
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'forge_version', rootProject.forge_version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'armor_model_api_version', rootProject.armor_model_api_version
    inputs.property 'spell_engine_version', rootProject.spell_engine_version
    inputs.property 'bundle_api_version', rootProject.bundle_api_version
    inputs.property 'ranged_weapon_api_version', rootProject.ranged_weapon_api_version
    inputs.property 'curios_version', rootProject.curios_version
    filesMatching('META-INF/mods.toml') {
        expand(
            version: project.version,
            forge_version: rootProject.forge_version,
            minecraft_version: rootProject.minecraft_version,
            armor_model_api_version: rootProject.armor_model_api_version,
            spell_engine_version: rootProject.spell_engine_version,
            bundle_api_version: rootProject.bundle_api_version,
            ranged_weapon_api_version: rootProject.ranged_weapon_api_version,
            curios_version: rootProject.curios_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}
remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn(shadowJar)
    archiveClassifier = ''
}
