plugins { id 'com.github.johnrengelman.shadow' }
architectury { platformSetupLoomIde(); forge() }
loom {
    forge { mixinConfig 'spell_power.mixins.json' }
    runs {
        server {
            if (project.hasProperty('spellPowerCiSelfTest')) property 'spellPower.ci.selftest', 'true'
        }
    }
}
configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

File requiredJar(String propertyName) {
    def value = providers.gradleProperty(propertyName).orNull
    if (value == null || value.trim().isEmpty()) throw new GradleException("Missing -P${propertyName}=...")
    def file = rootProject.file(value.trim())
    if (!file.isFile()) throw new GradleException("${propertyName} does not exist: ${file}")
    return file
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // TinyConfig 3.1.0 remains its own mod at both development and release boundaries.
    // Userdev needs the exact Forge artifact visible to the module layer, but it must never be
    // included/shaded into Spell Power.
    def tinyConfigForge = requiredJar('tiny_config_forge_jar')
    modCompileOnly files(tinyConfigForge)
    modRuntimeOnly files(tinyConfigForge)
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand(version: project.version) }
}
shadowJar { configurations = [project.configurations.shadowBundle]; archiveClassifier = 'dev-shadow' }
remapJar { inputFile.set shadowJar.archiveFile; dependsOn shadowJar; archiveClassifier='' }
