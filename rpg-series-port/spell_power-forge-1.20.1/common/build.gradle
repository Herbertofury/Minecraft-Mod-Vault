architectury { common(rootProject.enabled_platforms.split(',')) }
sourceSets {
    main {
        java.srcDir 'src/generatedUpstream/java'
        resources.srcDir 'src/generatedUpstream/resources'
    }
}

File requiredJar(String propertyName) {
    def value = providers.gradleProperty(propertyName).orNull
    if (value == null || value.trim().isEmpty()) throw new GradleException("Missing -P${propertyName}=...")
    def file = rootProject.file(value.trim())
    if (!file.isFile()) throw new GradleException("${propertyName} does not exist: ${file}")
    return file
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.5"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    // TinyConfig 3.1.0 is a separately packaged graduated foundation. Compile against its exact
    // common ABI; never source-inject, shade, or silently resolve the obsolete JitPack package era.
    compileOnly files(requiredJar('tiny_config_common_jar'))
}
