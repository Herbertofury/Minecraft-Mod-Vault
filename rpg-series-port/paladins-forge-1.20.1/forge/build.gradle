plugins { id 'com.github.johnrengelman.shadow' }
architectury { platformSetupLoomIde(); forge() }

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

File requiredJar(String propertyName) {
    def value = providers.gradleProperty(propertyName).orNull
    if (value == null || value.trim().isEmpty()) throw new GradleException("Missing -P${propertyName}=...")
    def file = rootProject.file(value.trim())
    if (!file.isFile()) throw new GradleException("${propertyName} does not exist: ${file}")
    return file
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Graduated foundations remain real separate mods. Paladins consumes them; it never shades them.
    [
        requiredJar('shield_api_forge_jar'),
        requiredJar('armor_model_api_forge_jar'),
        requiredJar('runes_forge_jar'),
        requiredJar('structure_pool_api_forge_jar'),
        requiredJar('spell_power_forge_jar'),
        requiredJar('spell_engine_forge_jar'),
        requiredJar('tiny_config_forge_jar'),
        requiredJar('cloth_config_forge_jar'),
        requiredJar('player_animator_forge_jar'),
        requiredJar('curios_jar')
    ].each { jar ->
        modCompileOnly files(jar)
        modRuntimeOnly files(jar)
    }

    // Spell Engine owns MixinExtras in real packaging; plain-file Loom runs need it exposed explicitly.
    runtimeOnly "io.github.llamalad7:mixinextras-forge:$rootProject.mixinextras_version"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'forge_version', rootProject.forge_version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'armor_model_api_version', rootProject.armor_model_api_version
    inputs.property 'spell_engine_version', rootProject.spell_engine_version
    inputs.property 'runes_version', rootProject.runes_version
    filesMatching('META-INF/mods.toml') {
        expand(
            version: project.version,
            forge_version: rootProject.forge_version,
            minecraft_version: rootProject.minecraft_version,
            armor_model_api_version: rootProject.armor_model_api_version,
            spell_engine_version: rootProject.spell_engine_version,
            runes_version: rootProject.runes_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}
remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn(shadowJar)
    archiveClassifier = ''
    doLast {
        def releaseJar = archiveFile.get().asFile
        def forbidden = zipTree(releaseJar).matching {
            include 'com/llamalad7/mixinextras/**'
            include 'META-INF/jars/*mixinextras*.jar'
        }.files
        if (!forbidden.isEmpty()) {
            throw new GradleException("Userdev-only MixinExtras leaked into Paladins release: ${forbidden}")
        }
    }
}
