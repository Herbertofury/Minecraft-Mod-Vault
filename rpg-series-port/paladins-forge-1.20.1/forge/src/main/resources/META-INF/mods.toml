# Upstream 3.1.1 embeds Shield API and declares Shield/Structure Pool as required on its
# publication surfaces. This port deliberately keeps all foundations as separate real Forge mods,
# so their runtime ownership is explicit instead of silently shading them into Paladins.
[[dependencies.paladins]]
modId="shield_api"
mandatory=true
versionRange="[2.1.0,)"
ordering="NONE"
side="BOTH"

