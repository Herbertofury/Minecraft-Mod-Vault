architectury {
    common 'forge'
}

File requiredJar(String propertyName) {
    def value = providers.gradleProperty(propertyName).orNull
    if (value == null || value.trim().isEmpty()) throw new GradleException("Missing -P${propertyName}=...")
    def file = rootProject.file(value.trim())
    if (!file.isFile()) throw new GradleException("${propertyName} does not exist: ${file}")
    return file
}

def commonAbi = [
    requiredJar('shield_api_common_jar'),
    requiredJar('armor_model_api_common_jar'),
    requiredJar('runes_common_jar'),
    requiredJar('structure_pool_api_common_jar'),
    requiredJar('spell_power_common_jar'),
    requiredJar('spell_engine_common_jar'),
    requiredJar('tiny_config_common_jar')
]

dependencies {
    // Separately built named common artifacts: ABI only, never sibling-source coupling or shading.
    commonAbi.each { jar -> compileOnly files(jar) }

    // Loader-neutral current Paladins APIs. Forge artifacts are supplied separately to the Forge leaf/runtime.
    modCompileOnly('me.shedaniel.cloth:cloth-config-fabric:11.1.136') { transitive = false }
    modCompileOnly('dev.kosmx.player-anim:player-animation-lib-fabric:1.0.2+1.19.4') { transitive = false }

    // Current common source carries loader annotations and Sponge mixins.
    compileOnly 'net.fabricmc:fabric-loader:0.15.11'
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

def generatedJava = rootProject.file('generated/common/java')
def generatedResources = rootProject.file('generated/common/resources')
sourceSets.main.java.setSrcDirs([generatedJava])
sourceSets.main.resources.setSrcDirs([generatedResources])

tasks.register('materializeCurrentPaladins', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('materialize_port.sh').absolutePath
    outputs.dir generatedJava
    outputs.dir generatedResources
}
tasks.named('compileJava').configure { dependsOn 'materializeCurrentPaladins' }
tasks.named('processResources').configure { dependsOn 'materializeCurrentPaladins' }
